<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-label="1から9の数字を3行3列に並べた九星の盤（たて・よこ・ななめの合計がどれも15になる）を、五行の色で描いたイラスト">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="480" fill="url(#bg)"/>
  
  <circle cx="480" cy="215" r="250" fill="url(#g)"/>
  <circle cx="480" cy="215" r="215" fill="none" stroke="#D4B26C" stroke-opacity=".35"/><rect x="330" y="70" width="90" height="90" rx="8" fill="#15120d" stroke="#5E9C80" stroke-width="2"/><text x="375" y="132" text-anchor="middle" font-family="serif" font-size="46" fill="#5E9C80">4</text><rect x="430" y="70" width="90" height="90" rx="8" fill="#15120d" stroke="#C9665B" stroke-width="2"/><text x="475" y="132" text-anchor="middle" font-family="serif" font-size="46" fill="#C9665B">9</text><rect x="530" y="70" width="90" height="90" rx="8" fill="#15120d" stroke="#D3A64A" stroke-width="2"/><text x="575" y="132" text-anchor="middle" font-family="serif" font-size="46" fill="#D3A64A">2</text><rect x="330" y="170" width="90" height="90" rx="8" fill="#15120d" stroke="#5E9C80" stroke-width="2"/><text x="375" y="232" text-anchor="middle" font-family="serif" font-size="46" fill="#5E9C80">3</text><rect x="430" y="170" width="90" height="90" rx="8" fill="#15120d" stroke="#D3A64A" stroke-width="2"/><text x="475" y="232" text-anchor="middle" font-family="serif" font-size="46" fill="#D3A64A">5</text><rect x="530" y="170" width="90" height="90" rx="8" fill="#15120d" stroke="#DCD8CC" stroke-width="2"/><text x="575" y="232" text-anchor="middle" font-family="serif" font-size="46" fill="#DCD8CC">7</text><rect x="330" y="270" width="90" height="90" rx="8" fill="#15120d" stroke="#D3A64A" stroke-width="2"/><text x="375" y="332" text-anchor="middle" font-family="serif" font-size="46" fill="#D3A64A">8</text><rect x="430" y="270" width="90" height="90" rx="8" fill="#15120d" stroke="#6178AE" stroke-width="2"/><text x="475" y="332" text-anchor="middle" font-family="serif" font-size="46" fill="#6178AE">1</text><rect x="530" y="270" width="90" height="90" rx="8" fill="#15120d" stroke="#DCD8CC" stroke-width="2"/><text x="575" y="332" text-anchor="middle" font-family="serif" font-size="46" fill="#DCD8CC">6</text>
  <text x="480" y="402" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#EEE7D7" opacity=".85">たて・よこ・ななめ、どこをたしても15</text>
  <text x="480.0" y="456" text-anchor="middle" font-family="serif" font-size="21" fill="#D4B26C" letter-spacing="5">九つの星がめぐる盤</text>
</svg>
