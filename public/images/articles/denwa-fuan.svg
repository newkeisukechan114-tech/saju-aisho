<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-label="電話占いでよくある6つの不安。知らない人と話す、料金、個人情報、言われること、話すこと、結果に振り回される">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="460" fill="url(#bg)"/>
  <text x="480" y="55" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C">はじめての電話占い、よくある6つの不安</text><rect x="60" y="90" width="260" height="130" rx="12" fill="#15120d" stroke="rgba(212,178,108,.35)"/><text x="190" y="142" text-anchor="middle" font-family="serif" font-size="32" fill="#D4B26C">1</text><text x="190" y="185" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#EEE7D7">知らない人と話す</text><rect x="350" y="90" width="260" height="130" rx="12" fill="#15120d" stroke="rgba(212,178,108,.35)"/><text x="480" y="142" text-anchor="middle" font-family="serif" font-size="32" fill="#D4B26C">2</text><text x="480" y="185" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#EEE7D7">料金が高くならない？</text><rect x="640" y="90" width="260" height="130" rx="12" fill="#15120d" stroke="rgba(212,178,108,.35)"/><text x="770" y="142" text-anchor="middle" font-family="serif" font-size="32" fill="#D4B26C">3</text><text x="770" y="185" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#EEE7D7">個人情報は大丈夫？</text><rect x="60" y="250" width="260" height="130" rx="12" fill="#15120d" stroke="rgba(212,178,108,.35)"/><text x="190" y="302" text-anchor="middle" font-family="serif" font-size="32" fill="#D4B26C">4</text><text x="190" y="345" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#EEE7D7">きついことを言われそう</text><rect x="350" y="250" width="260" height="130" rx="12" fill="#15120d" stroke="rgba(212,178,108,.35)"/><text x="480" y="302" text-anchor="middle" font-family="serif" font-size="32" fill="#D4B26C">5</text><text x="480" y="345" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#EEE7D7">何を話せばいい？</text><rect x="640" y="250" width="260" height="130" rx="12" fill="#15120d" stroke="rgba(212,178,108,.35)"/><text x="770" y="302" text-anchor="middle" font-family="serif" font-size="32" fill="#D4B26C">6</text><text x="770" y="345" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#EEE7D7">結果に振り回されない？</text><text x="480.0" y="440" text-anchor="middle" font-family="serif" font-size="21" fill="#D4B26C" letter-spacing="5">どれも、準備しておけば大丈夫</text>
</svg>
