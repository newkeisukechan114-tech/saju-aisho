<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-label="中央の「60の干支」を囲んで、土星人・金星人・火星人・天王星人・木星人・水星人の6つの星が輪になって並ぶイラスト">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="480" fill="url(#bg)"/>
  <circle cx="480" cy="215" r="130" fill="none" stroke="#D4B26C" stroke-opacity=".35" stroke-dasharray="3 7"/><circle cx="480" cy="85" r="34" fill="#C9A66B"/><text x="480" y="41" text-anchor="middle" font-family="serif" font-size="18" fill="#EEE7D7">土星人</text><circle cx="593" cy="150" r="34" fill="#E8D9A8"/><text x="593" y="106" text-anchor="middle" font-family="serif" font-size="18" fill="#EEE7D7">金星人</text><circle cx="593" cy="280" r="34" fill="#D9735F"/><text x="593" y="338" text-anchor="middle" font-family="serif" font-size="18" fill="#EEE7D7">火星人</text><circle cx="480" cy="345" r="34" fill="#8FB8D8"/><text x="480" y="403" text-anchor="middle" font-family="serif" font-size="18" fill="#EEE7D7">天王星人</text><circle cx="367" cy="280" r="34" fill="#7FB08A"/><text x="367" y="338" text-anchor="middle" font-family="serif" font-size="18" fill="#EEE7D7">木星人</text><circle cx="367" cy="150" r="34" fill="#6F86C2"/><text x="367" y="106" text-anchor="middle" font-family="serif" font-size="18" fill="#EEE7D7">水星人</text><circle cx="480" cy="215" r="60" fill="#15120d" stroke="#D4B26C"/><text x="480" y="208" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C">60の</text><text x="480" y="238" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C">干支</text><text x="480.0" y="462" text-anchor="middle" font-family="serif" font-size="21" fill="#D4B26C" letter-spacing="5">六星占術とサジュは、同じ「60の干支」から</text>
</svg>
