<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="五行の相剋を星形の矢印で表した図。木が土を、土が水を、水が火を、火が金を、金が木を抑える。干合の5組はすべて相剋の組み合わせ">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="420" fill="url(#bg)"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#D4B26C"/></marker></defs><path d="M480 75 L613 172" stroke="rgba(238,231,215,.18)" stroke-width="2" stroke-dasharray="4 6"/><path d="M613 172 L562 328" stroke="rgba(238,231,215,.18)" stroke-width="2" stroke-dasharray="4 6"/><path d="M562 328 L398 328" stroke="rgba(238,231,215,.18)" stroke-width="2" stroke-dasharray="4 6"/><path d="M398 328 L347 172" stroke="rgba(238,231,215,.18)" stroke-width="2" stroke-dasharray="4 6"/><path d="M347 172 L480 75" stroke="rgba(238,231,215,.18)" stroke-width="2" stroke-dasharray="4 6"/><path d="M494 117 L547 281" stroke="#D4B26C" stroke-width="3" marker-end="url(#ar)"/><path d="M578 198 L438 299" stroke="#D4B26C" stroke-width="3" marker-end="url(#ar)"/><path d="M527 302 L387 201" stroke="#D4B26C" stroke-width="3" marker-end="url(#ar)"/><path d="M411 286 L465 123" stroke="#D4B26C" stroke-width="3" marker-end="url(#ar)"/><path d="M391 172 L563 172" stroke="#D4B26C" stroke-width="3" marker-end="url(#ar)"/><circle cx="480" cy="75" r="38" fill="#15120d" stroke="#5E9C80" stroke-width="3"/><text x="480" y="87" text-anchor="middle" font-family="serif" font-size="34" fill="#5E9C80">木</text><circle cx="613" cy="172" r="38" fill="#15120d" stroke="#C9665B" stroke-width="3"/><text x="613" y="184" text-anchor="middle" font-family="serif" font-size="34" fill="#C9665B">火</text><circle cx="562" cy="328" r="38" fill="#15120d" stroke="#D3A64A" stroke-width="3"/><text x="562" y="340" text-anchor="middle" font-family="serif" font-size="34" fill="#D3A64A">土</text><circle cx="398" cy="328" r="38" fill="#15120d" stroke="#DCD8CC" stroke-width="3"/><text x="398" y="340" text-anchor="middle" font-family="serif" font-size="34" fill="#DCD8CC">金</text><circle cx="347" cy="172" r="38" fill="#15120d" stroke="#6178AE" stroke-width="3"/><text x="347" y="184" text-anchor="middle" font-family="serif" font-size="34" fill="#6178AE">水</text><g font-family="sans-serif" font-size="17" fill="#EEE7D7">
  <text x="50" y="110" fill="#D4B26C">矢印＝相剋</text><text x="50" y="140">矢印のもとが、</text><text x="50" y="166">先にある五行を抑える</text>
  <text x="50" y="210">木→土 土→水</text><text x="50" y="236">水→火 火→金 金→木</text></g>
  <g font-family="sans-serif" font-size="17" fill="#EEE7D7"><text x="690" y="110" fill="#D4B26C">強く引き合う「干合」</text>
  <text x="690" y="140">甲×己　乙×庚</text><text x="690" y="166">丙×辛　丁×壬</text><text x="690" y="192">戊×癸</text>
  <text x="690" y="236">5組とも、じつは</text><text x="690" y="262">相剋の組み合わせ</text></g><text x="480.0" y="400" text-anchor="middle" font-family="serif" font-size="21" fill="#D4B26C" letter-spacing="5">相剋と干合</text>
</svg>
