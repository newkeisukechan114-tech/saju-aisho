  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient>
    <radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5E9C80" stop-opacity=".35"/><stop offset="1" stop-color="#5E9C80" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="960" height="480" fill="url(#bg)"/>
  <circle cx="480" cy="250" r="240" fill="url(#g)"/>
  <g><rect x="465" y="250" width="30" height="150" rx="6" fill="#6b4f3a"/><circle cx="480" cy="190" r="95" fill="#5E9C80"/><circle cx="410" cy="230" r="60" fill="#5E9C80" opacity=".85"/><circle cx="550" cy="230" r="60" fill="#5E9C80" opacity=".85"/><circle cx="480" cy="140" r="55" fill="#7fb89c" opacity=".7"/></g>
