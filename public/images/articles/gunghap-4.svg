<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="クンハプの4つの観点の図。日主の結びつき、暮らしのリズム、干支の相性、五行の補い合い">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="440" fill="url(#bg)"/>
  <text x="480" y="55" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C">ふたりのサジュを、4つの観点で比べる</text><rect x="30" y="90" width="212" height="250" rx="12" fill="#15120d" stroke="rgba(212,178,108,.35)"/><circle cx="136" cy="160" r="40" fill="none" stroke="#e98aa0" stroke-width="3"/><text x="136" y="172" text-anchor="middle" font-family="serif" font-size="32" fill="#e98aa0">壹</text><text x="136" y="250" text-anchor="middle" font-family="serif" font-size="20" fill="#D4B26C">日主の結びつき</text><text x="136" y="290" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#EEE7D7">心の相性</text><rect x="262" y="90" width="212" height="250" rx="12" fill="#15120d" stroke="rgba(212,178,108,.35)"/><circle cx="368" cy="160" r="40" fill="none" stroke="#7fb89c" stroke-width="3"/><text x="368" y="172" text-anchor="middle" font-family="serif" font-size="32" fill="#7fb89c">貳</text><text x="368" y="250" text-anchor="middle" font-family="serif" font-size="20" fill="#D4B26C">暮らしのリズム</text><text x="368" y="290" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#EEE7D7">一緒に過ごす心地よさ</text><rect x="494" y="90" width="212" height="250" rx="12" fill="#15120d" stroke="rgba(212,178,108,.35)"/><circle cx="600" cy="160" r="40" fill="none" stroke="#D4B26C" stroke-width="3"/><text x="600" y="172" text-anchor="middle" font-family="serif" font-size="32" fill="#D4B26C">參</text><text x="600" y="250" text-anchor="middle" font-family="serif" font-size="20" fill="#D4B26C">干支の相性</text><text x="600" y="290" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#EEE7D7">まわりとの関係</text><rect x="726" y="90" width="212" height="250" rx="12" fill="#15120d" stroke="rgba(212,178,108,.35)"/><circle cx="832" cy="160" r="40" fill="none" stroke="#9aa6c4" stroke-width="3"/><text x="832" y="172" text-anchor="middle" font-family="serif" font-size="32" fill="#9aa6c4">肆</text><text x="832" y="250" text-anchor="middle" font-family="serif" font-size="20" fill="#D4B26C">五行の補い合い</text><text x="832" y="290" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#EEE7D7">足りない力を補えるか</text><text x="480.0" y="410" text-anchor="middle" font-family="serif" font-size="21" fill="#D4B26C" letter-spacing="5">クンハプ（궁합）＝相性</text>
</svg>
