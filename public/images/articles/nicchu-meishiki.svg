<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-label="時柱・日柱・月柱・年柱の4本の柱を並べ、日柱だけを金色で強調した図。例として1992年5月14日生まれは日柱が庚寅">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="450" fill="url(#bg)"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#D4B26C"/></marker></defs><text x="480" y="52" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C" letter-spacing="3">命式の4本の柱と「日柱」</text><rect x="150" y="90" width="150" height="300" rx="12" fill="#15120d" stroke="#D4B26C" stroke-opacity="0.35" stroke-width="1"/><text x="225" y="128" text-anchor="middle" font-family="serif" font-size="20" fill="#EEE7D7">時柱</text><text x="225" y="152" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#EEE7D7" opacity=".7">生まれた時間</text><text x="225" y="235" text-anchor="middle" font-family="serif" font-size="56" fill="#EEE7D7">?</text><text x="225" y="320" text-anchor="middle" font-family="serif" font-size="56" fill="#EEE7D7">?</text><rect x="340" y="90" width="150" height="300" rx="12" fill="#2a2216" stroke="#D4B26C" stroke-opacity="1" stroke-width="3"/><text x="415" y="128" text-anchor="middle" font-family="serif" font-size="20" fill="#D4B26C">日柱</text><text x="415" y="152" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#EEE7D7" opacity=".7">生まれた日</text><text x="415" y="235" text-anchor="middle" font-family="serif" font-size="56" fill="#D4B26C">庚</text><text x="415" y="320" text-anchor="middle" font-family="serif" font-size="56" fill="#D4B26C">寅</text><rect x="530" y="90" width="150" height="300" rx="12" fill="#15120d" stroke="#D4B26C" stroke-opacity="0.35" stroke-width="1"/><text x="605" y="128" text-anchor="middle" font-family="serif" font-size="20" fill="#EEE7D7">月柱</text><text x="605" y="152" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#EEE7D7" opacity=".7">生まれた月</text><text x="605" y="235" text-anchor="middle" font-family="serif" font-size="56" fill="#EEE7D7">乙</text><text x="605" y="320" text-anchor="middle" font-family="serif" font-size="56" fill="#EEE7D7">巳</text><rect x="720" y="90" width="150" height="300" rx="12" fill="#15120d" stroke="#D4B26C" stroke-opacity="0.35" stroke-width="1"/><text x="795" y="128" text-anchor="middle" font-family="serif" font-size="20" fill="#EEE7D7">年柱</text><text x="795" y="152" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#EEE7D7" opacity=".7">生まれた年</text><text x="795" y="235" text-anchor="middle" font-family="serif" font-size="56" fill="#EEE7D7">壬</text><text x="795" y="320" text-anchor="middle" font-family="serif" font-size="56" fill="#EEE7D7">申</text><text x="320" y="420" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#D4B26C">↑ 上の字＝日主（あなた自身）／下の字＝日支（心の奥・パートナーの座）</text><text x="480.0" y="446" text-anchor="middle" font-family="serif" font-size="21" fill="#D4B26C" letter-spacing="5"></text>
</svg>
