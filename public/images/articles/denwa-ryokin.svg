<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="3,000円分の無料クーポンで話せる時間の目安。1分100円なら30分、150円なら20分、200円なら15分、300円なら10分">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="420" fill="url(#bg)"/>
  <text x="480" y="55" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C">3,000円分のクーポンで話せる時間の目安</text><text x="170" y="124" text-anchor="end" font-family="sans-serif" font-size="20" fill="#EEE7D7">1分100円</text><rect x="190" y="104" width="600" height="28" rx="6" fill="rgba(238,231,215,.08)"/><rect x="190" y="104" width="600" height="28" rx="6" fill="#D4B26C"/><text x="810" y="124" text-anchor="start" font-family="serif" font-size="22" fill="#D4B26C">約30分</text><text x="170" y="194" text-anchor="end" font-family="sans-serif" font-size="20" fill="#EEE7D7">1分150円</text><rect x="190" y="174" width="600" height="28" rx="6" fill="rgba(238,231,215,.08)"/><rect x="190" y="174" width="400" height="28" rx="6" fill="#D4B26C"/><text x="810" y="194" text-anchor="start" font-family="serif" font-size="22" fill="#D4B26C">約20分</text><text x="170" y="264" text-anchor="end" font-family="sans-serif" font-size="20" fill="#EEE7D7">1分200円</text><rect x="190" y="244" width="600" height="28" rx="6" fill="rgba(238,231,215,.08)"/><rect x="190" y="244" width="300" height="28" rx="6" fill="#D4B26C"/><text x="810" y="264" text-anchor="start" font-family="serif" font-size="22" fill="#D4B26C">約15分</text><text x="170" y="334" text-anchor="end" font-family="sans-serif" font-size="20" fill="#EEE7D7">1分300円</text><rect x="190" y="314" width="600" height="28" rx="6" fill="rgba(238,231,215,.08)"/><rect x="190" y="314" width="200" height="28" rx="6" fill="#D4B26C"/><text x="810" y="334" text-anchor="start" font-family="serif" font-size="22" fill="#D4B26C">約10分</text><text x="480.0" y="400" text-anchor="middle" font-family="serif" font-size="21" fill="#D4B26C" letter-spacing="5">料金は占い師ごとに異なります</text>
</svg>
