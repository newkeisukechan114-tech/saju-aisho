  <rect width="960" height="450" fill="url(#bg)"/>
  <text x="480" y="48" text-anchor="middle" font-family="serif" font-size="23" fill="#D4B26C" letter-spacing="3">自然と引かれ合う「干合（かんごう）」の5組</text><circle cx="96" cy="150" r="40" fill="#15120d" stroke="#5E9C80" stroke-width="3"/><text x="96" y="162" text-anchor="middle" font-family="serif" font-size="34" fill="#5E9C80">甲</text><text x="96" y="98" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7" opacity=".85">大樹</text><circle cx="96" cy="300" r="40" fill="#15120d" stroke="#D3A64A" stroke-width="3"/><text x="96" y="312" text-anchor="middle" font-family="serif" font-size="34" fill="#D3A64A">己</text><text x="96" y="366" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7" opacity=".85">田畑</text><path d="M96 192 V258" stroke="#E59AA8" stroke-width="3" stroke-dasharray="4 5"/><path transform="translate(96 225) scale(.9)" d="M0 10 C-6 4 -14 0 -14 -6 C-14 -11 -10 -14 -6 -14 C-3 -14 -1 -12 0 -10 C1 -12 3 -14 6 -14 C10 -14 14 -11 14 -6 C14 0 6 4 0 10Z" fill="#E59AA8"/><circle cx="288" cy="150" r="40" fill="#15120d" stroke="#5E9C80" stroke-width="3"/><text x="288" y="162" text-anchor="middle" font-family="serif" font-size="34" fill="#5E9C80">乙</text><text x="288" y="98" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7" opacity=".85">草花</text><circle cx="288" cy="300" r="40" fill="#15120d" stroke="#DCD8CC" stroke-width="3"/><text x="288" y="312" text-anchor="middle" font-family="serif" font-size="34" fill="#DCD8CC">庚</text><text x="288" y="366" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7" opacity=".85">鋼</text><path d="M288 192 V258" stroke="#E59AA8" stroke-width="3" stroke-dasharray="4 5"/><path transform="translate(288 225) scale(.9)" d="M0 10 C-6 4 -14 0 -14 -6 C-14 -11 -10 -14 -6 -14 C-3 -14 -1 -12 0 -10 C1 -12 3 -14 6 -14 C10 -14 14 -11 14 -6 C14 0 6 4 0 10Z" fill="#E59AA8"/><circle cx="480" cy="150" r="40" fill="#15120d" stroke="#C9665B" stroke-width="3"/><text x="480" y="