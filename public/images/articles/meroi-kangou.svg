<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-label="干合の5組。甲と己、乙と庚、丙と辛、丁と壬、戊と癸を上下に並べ、ハートの印のついた線で結んだ図">
