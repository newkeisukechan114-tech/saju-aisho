<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" role="img" aria-label="サジュの日主は生まれ持った気質、サジュの運の流れは動きやすい時期、九星気学の方位は向かうとよい方角を表し、3つを重ねる図">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="370" fill="url(#bg)"/>
  <text x="480" y="46" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C" letter-spacing="3">ふたつを重ねると、そろうこと</text><rect x="70" y="90" width="240" height="210" rx="12" fill="#15120d" stroke="#D4B26C" stroke-width="2"/><text x="190" y="140" text-anchor="middle" font-family="serif" font-size="21" fill="#D4B26C">サジュの日主</text><path d="M110 160 H270" stroke="#D4B26C" stroke-opacity=".4"/><text x="190" y="212" text-anchor="middle" font-family="serif" font-size="26" fill="#EEE7D7">「どんな自分で」</text><text x="190" y="258" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#EEE7D7" opacity=".85">生まれ持った気質</text><text x="340" y="206" text-anchor="middle" font-family="serif" font-size="30" fill="#D4B26C">＋</text><rect x="370" y="90" width="240" height="210" rx="12" fill="#15120d" stroke="#5E9C80" stroke-width="2"/><text x="490" y="140" text-anchor="middle" font-family="serif" font-size="21" fill="#5E9C80">サジュの運の流れ</text><path d="M410 160 H570" stroke="#5E9C80" stroke-opacity=".4"/><text x="490" y="212" text-anchor="middle" font-family="serif" font-size="26" fill="#EEE7D7">「いつ」</text><text x="490" y="258" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#EEE7D7" opacity=".85">動きやすい時期</text><text x="640" y="206" text-anchor="middle" font-family="serif" font-size="30" fill="#D4B26C">＋</text><rect x="670" y="90" width="240" height="210" rx="12" fill="#15120d" stroke="#b39ad6" stroke-width="2"/><text x="790" y="140" text-anchor="middle" font-family="serif" font-size="21" fill="#b39ad6">九星気学の方位</text><path d="M710 160 H870" stroke="#b39ad6" stroke-opacity=".4"/><text x="790" y="212" text-anchor="middle" font-family="serif" font-size="26" fill="#EEE7D7">「どこへ」</text><text x="790" y="258" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#EEE7D7" opacity=".85">向かうとよい方角</text><text x="480" y="345" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#EEE7D7">「どんな自分で・いつ・どこへ」がそろうと、動き方が具体的になります</text>
</svg>
