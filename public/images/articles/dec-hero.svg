<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-label="雪の舞う冬の夜空に、金色の「庚」と青い「子」の二文字が並び、その下に「12月」と記されたイラスト">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="480" fill="url(#bg)"/>
  
  <circle cx="480" cy="220" r="250" fill="url(#g)"/><circle cx="110" cy="70" r="3" fill="#fff" opacity=".55"/><circle cx="200" cy="170" r="2" fill="#fff" opacity=".55"/><circle cx="300" cy="90" r="3" fill="#fff" opacity=".55"/><circle cx="690" cy="60" r="2" fill="#fff" opacity=".55"/><circle cx="780" cy="160" r="3" fill="#fff" opacity=".55"/><circle cx="860" cy="80" r="2" fill="#fff" opacity=".55"/><circle cx="150" cy="300" r="2" fill="#fff" opacity=".55"/><circle cx="820" cy="320" r="3" fill="#fff" opacity=".55"/><circle cx="620" cy="110" r="2" fill="#fff" opacity=".55"/><circle cx="360" cy="200" r="2" fill="#fff" opacity=".55"/><circle cx="250" cy="380" r="2" fill="#fff" opacity=".55"/><circle cx="720" cy="390" r="2" fill="#fff" opacity=".55"/>
  <rect x="300" y="110" width="160" height="200" rx="14" fill="#15120d" stroke="#D4B26C" stroke-width="2.5"/><text x="380" y="250" text-anchor="middle" font-family="serif" font-size="120" fill="#DCD8CC">庚</text><text x="380" y="292" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#EEE7D7">かのえ・金</text>
  <rect x="500" y="110" width="160" height="200" rx="14" fill="#15120d" stroke="#D4B26C" stroke-width="2.5"/><text x="580" y="250" text-anchor="middle" font-family="serif" font-size="120" fill="#6178AE">子</text><text x="580" y="292" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#EEE7D7">ね・水</text>
  <text x="480" y="378" text-anchor="middle" font-family="serif" font-size="30" fill="#D4B26C" letter-spacing="8">2026年12月</text>
  <text x="480.0" y="456" text-anchor="middle" font-family="serif" font-size="21" fill="#D4B26C" letter-spacing="5">金と水がめぐる、冬の月</text>
</svg>
