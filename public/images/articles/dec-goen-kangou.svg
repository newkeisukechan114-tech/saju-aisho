<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-label="干合の5組。甲と己、乙と庚、丙と辛、丁と壬、戊と癸を上下に並べ、ハートの印の線で結んだ図">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="410" fill="url(#bg)"/>
  <text x="480" y="46" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C" letter-spacing="3">「ご縁の日」は、干合（かんごう）の相手の日</text><circle cx="110" cy="160" r="34" fill="none" stroke="#5E9C80" stroke-width="2"/><text x="110" y="171" text-anchor="middle" font-family="serif" font-size="30" fill="#5E9C80">甲</text><circle cx="110" cy="290" r="34" fill="none" stroke="#D3A64A" stroke-width="2"/><text x="110" y="301" text-anchor="middle" font-family="serif" font-size="30" fill="#D3A64A">己</text><path d="M110 198 V252" stroke="#d98c96" stroke-width="3"/><circle cx="110" cy="225" r="9" fill="#d98c96"/><circle cx="280" cy="160" r="34" fill="none" stroke="#5E9C80" stroke-width="2"/><text x="280" y="171" text-anchor="middle" font-family="serif" font-size="30" fill="#5E9C80">乙</text><circle cx="280" cy="290" r="34" fill="none" stroke="#DCD8CC" stroke-width="2"/><text x="280" y="301" text-anchor="middle" font-family="serif" font-size="30" fill="#DCD8CC">庚</text><path d="M280 198 V252" stroke="#d98c96" stroke-width="3"/><circle cx="280" cy="225" r="9" fill="#d98c96"/><circle cx="450" cy="160" r="34" fill="none" stroke="#C9665B" stroke-width="2"/><text x="450" y="171" text-anchor="middle" font-family="serif" font-size="30" fill="#C9665B">丙</text><circle cx="450" cy="290" r="34" fill="none" stroke="#DCD8CC" stroke-width="2"/><text x="450" y="301" text-anchor="middle" font-family="serif" font-size="30" fill="#DCD8CC">辛</text><path d="M450 198 V252" stroke="#d98c96" stroke-width="3"/><circle cx="450" cy="225" r="9" fill="#d98c96"/><circle cx="620" cy="160" r="34" fill="none" stroke="#C9665B" stroke-width="2"/><text x="620" y="171" text-anchor="middle" font-family="serif" font-size="30" fill="#C9665B">丁</text><circle cx="620" cy="290" r="34" fill="none" stroke="#6178AE" stroke-width="2"/><text x="620" y="301" text-anchor="middle" font-family="serif" font-size="30" fill="#6178AE">壬</text><path d="M620 198 V252" stroke="#d98c96" stroke-width="3"/><circle cx="620" cy="225" r="9" fill="#d98c96"/><circle cx="790" cy="160" r="34" fill="none" stroke="#D3A64A" stroke-width="2"/><text x="790" y="171" text-anchor="middle" font-family="serif" font-size="30" fill="#D3A64A">戊</text><circle cx="790" cy="290" r="34" fill="none" stroke="#6178AE" stroke-width="2"/><text x="790" y="301" text-anchor="middle" font-family="serif" font-size="30" fill="#6178AE">癸</text><path d="M790 198 V252" stroke="#d98c96" stroke-width="3"/><circle cx="790" cy="225" r="9" fill="#d98c96"/><text x="480" y="380" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#EEE7D7">自分の日主と「合」になる天干がめぐる日は、人とのご縁が結ばれやすい日とされます</text>
</svg>
