<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-label="韓屋の路地にあるAI占いブースのイメージイラスト">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14110c"/><stop offset="1" stop-color="#070605"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".45"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="960" height="480" fill="url(#sky)"/>
  <g fill="#D4B26C" opacity=".5"><circle cx="120" cy="70" r="1.6"/><circle cx="260" cy="40" r="1.2"/><circle cx="420" cy="90" r="1"/><circle cx="700" cy="50" r="1.5"/><circle cx="860" cy="100" r="1.1"/><circle cx="560" cy="30" r="1"/></g>
  <circle cx="820" cy="80" r="26" fill="none" stroke="#D4B26C" stroke-opacity=".6"/>
  <!-- hanok roofs -->
  <g fill="none" stroke="#D4B26C" stroke-width="2" stroke-opacity=".75">
    <path d="M20 250 Q120 205 220 230 Q300 200 380 250"/>
    <path d="M40 250 V400 M360 250 V400"/>
    <path d="M580 240 Q680 195 780 222 Q860 195 940 240"/>
    <path d="M600 240 V400 M920 240 V400"/>
  </g>
  <g stroke="#D4B26C" stroke-opacity=".3"><path d="M60 270 H340 M60 300 H340 M620 262 H900 M620 292 H900"/></g>
  <!-- booth -->
  <ellipse cx="480" cy="270" rx="190" ry="150" fill="url(#glow)"/>
  <rect x="400" y="170" width="160" height="230" rx="10" fill="#0e0c09" stroke="#D4B26C" stroke-width="2"/>
  <rect x="420" y="192" width="120" height="96" rx="6" fill="#1b170f" stroke="#D4B26C" stroke-opacity=".6"/>
  <circle cx="480" cy="232" r="22" fill="none" stroke="#D4B26C" stroke-width="1.6"/>
  <path d="M470 228 h4 M486 228 h4 M472 242 q8 6 16 0" stroke="#D4B26C" stroke-width="1.6" fill="none"/>
  <text x="480" y="276" text-anchor="middle" font-family="serif" font-size="12" fill="#D4B26C" letter-spacing="3">四 柱</text>
  <rect x="430" y="304" width="100" height="14" rx="3" fill="none" stroke="#D4B26C" stroke-opacity=".5"/>
  <rect x="430" y="326" width="100" height="14" rx="3" fill="none" stroke="#D4B26C" stroke-opacity=".5"/>
  <!-- talisman card -->
  <g transform="translate(590 300) rotate(8)">
    <rect width="72" height="104" rx="6" fill="#16120b" stroke="#D4B26C" stroke-width="1.6"/>
    <text x="36" y="34" text-anchor="middle" font-family="serif" font-size="20" fill="#D4B26C">福</text>
    <g fill="#D4B26C"><rect x="20" y="56" width="10" height="10"/><rect x="42" y="56" width="10" height="10"/><rect x="20" y="78" width="10" height="10"/><rect x="34" y="70" width="6" height="6"/><rect x="44" y="80" width="8" height="8"/></g>
  </g>
  <line x1="0" y1="400" x2="960" y2="400" stroke="#D4B26C" stroke-opacity=".4"/>
  <text x="480" y="450" text-anchor="middle" font-family="serif" font-size="15" fill="#D4B26C" fill-opacity=".8" letter-spacing="4">韓屋の路地に、AIの占いブース（イメージ）</text>
</svg>
