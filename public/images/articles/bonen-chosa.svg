<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" role="img" aria-label="東京商工リサーチの調査をもとにしたグラフ。2026年の忘・新年会を実施する企業は56.5%、実施しないは43.4%。実施しない理由は「ニーズが高くない」63.7%、「参加に抵抗感」39.6%">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="370" fill="url(#bg)"/>
  <text x="480" y="46" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C" letter-spacing="3">2026年の忘・新年会、企業の実施は56.5%</text><rect x="120" y="80" width="407" height="44" fill="#D4B26C" opacity=".8"/><rect x="527" y="80" width="312" height="44" fill="#5c5288"/><text x="323" y="109" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#15120d">実施する 56.5%</text><text x="683" y="109" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#EEE7D7">実施しない 43.4%</text><text x="120" y="180" font-family="serif" font-size="18" fill="#D4B26C">実施しない理由（上位2つ）</text><text x="120" y="228" font-family="sans-serif" font-size="17" fill="#EEE7D7">ニーズが高くない</text><rect x="300" y="208" width="306" height="30" rx="4" fill="#9aa6c4" opacity=".75"/><text x="616" y="230" font-family="sans-serif" font-size="17" fill="#EEE7D7">63.7%</text><text x="120" y="288" font-family="sans-serif" font-size="17" fill="#EEE7D7">参加に抵抗感</text><rect x="300" y="268" width="190" height="30" rx="4" fill="#9aa6c4" opacity=".75"/><text x="500" y="290" font-family="sans-serif" font-size="17" fill="#EEE7D7">39.6%</text><text x="480" y="352" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#EEE7D7" opacity=".75">出典：東京商工リサーチ「2026年 忘・新年会に関するアンケート」（企業向け調査）をもとに運営者作成</text>
</svg>
