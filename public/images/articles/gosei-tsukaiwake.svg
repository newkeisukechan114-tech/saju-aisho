<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="ふたつの占いの使い分け表。今年や来年の流れ、毎日の行動の目安は五星三心占い。性格の根っこ、相性、10年単位の流れはサジュがおすすめ">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="420" fill="url(#bg)"/>
  <text x="480" y="46" text-anchor="middle" font-family="serif" font-size="23" fill="#D4B26C" letter-spacing="3">ふたつの占いの、おすすめの使い分け</text><rect x="90" y="80" width="540" height="52" rx="10" fill="#15120d" stroke="rgba(212,178,108,.3)"/><text x="115" y="113" font-family="sans-serif" font-size="18" fill="#EEE7D7">今年・来年の流れを、ざっくり知りたい</text><path d="M640 106 H690" stroke="#D4B26C" stroke-width="3"/><path d="M690 98 L704 106 L690 114Z" fill="#D4B26C"/><rect x="714" y="80" width="160" height="52" rx="10" fill="#D4B26C" opacity=".9"/><text x="794" y="113" text-anchor="middle" font-family="serif" font-size="19" fill="#1c1712">五星三心占い</text><rect x="90" y="146" width="540" height="52" rx="10" fill="#15120d" stroke="rgba(212,178,108,.3)"/><text x="115" y="179" font-family="sans-serif" font-size="18" fill="#EEE7D7">毎日の行動の目安がほしい</text><path d="M640 172 H690" stroke="#D4B26C" stroke-width="3"/><path d="M690 164 L704 172 L690 180Z" fill="#D4B26C"/><rect x="714" y="146" width="160" height="52" rx="10" fill="#D4B26C" opacity=".9"/><text x="794" y="179" text-anchor="middle" font-family="serif" font-size="19" fill="#1c1712">五星三心占い</text><rect x="90" y="212" width="540" height="52" rx="10" fill="#15120d" stroke="rgba(212,178,108,.3)"/><text x="115" y="245" font-family="sans-serif" font-size="18" fill="#EEE7D7">自分の性格の根っこを知りたい</text><path d="M640 238 H690" stroke="#8FB8D8" stroke-width="3"/><path d="M690 230 L704 238 L690 246Z" fill="#8FB8D8"/><rect x="714" y="212" width="160" height="52" rx="10" fill="#8FB8D8" opacity=".9"/><text x="794" y="245" text-anchor="middle" font-family="serif" font-size="19" fill="#1c1712">サジュ</text><rect x="90" y="278" width="540" height="52" rx="10" fill="#15120d" stroke="rgba(212,178,108,.3)"/><text x="115" y="311" font-family="sans-serif" font-size="18" fill="#EEE7D7">ふたりの相性を、細かく見たい</text><path d="M640 304 H690" stroke="#8FB8D8" stroke-width="3"/><path d="M690 296 L704 304 L690 312Z" fill="#8FB8D8"/><rect x="714" y="278" width="160" height="52" rx="10" fill="#8FB8D8" opacity=".9"/><text x="794" y="311" text-anchor="middle" font-family="serif" font-size="19" fill="#1c1712">サジュ</text><rect x="90" y="344" width="540" height="52" rx="10" fill="#15120d" stroke="rgba(212,178,108,.3)"/><text x="115" y="377" font-family="sans-serif" font-size="18" fill="#EEE7D7">10年単位の大きな流れを知りたい</text><path d="M640 370 H690" stroke="#8FB8D8" stroke-width="3"/><path d="M690 362 L704 370 L690 378Z" fill="#8FB8D8"/><rect x="714" y="344" width="160" height="52" rx="10" fill="#8FB8D8" opacity=".9"/><text x="794" y="377" text-anchor="middle" font-family="serif" font-size="19" fill="#1c1712">サジュ</text>
</svg>
