<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-label="五星三心占いとサジュの比較図。五星三心占いは生年月日から6つの星座と金銀で12タイプを出し、年ごとの運気を見る。サジュは生年月日と時間から4つの柱を出し、日主10タイプや日柱60通りで、五行バランスや相性、大運を見る">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="450" fill="url(#bg)"/>
  <text x="480" y="46" text-anchor="middle" font-family="serif" font-size="23" fill="#D4B26C" letter-spacing="3">五星三心占いとサジュ、見るものの違い</text><rect x="50" y="80" width="400" height="340" rx="18" fill="#15120d" stroke="#D4B26C" stroke-opacity=".7"/><text x="250" y="122" text-anchor="middle" font-family="serif" font-size="24" fill="#D4B26C">五星三心占い</text><text x="250" y="170" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#EEE7D7">生年月日</text><text x="250" y="214" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#D4B26C">↓</text><text x="250" y="258" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#EEE7D7">6つの星座 × 金・銀</text><text x="250" y="302" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#EEE7D7">＝ 12タイプ</text><text x="250" y="346" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#D4B26C">↓</text><text x="250" y="390" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#EEE7D7">年ごとの運気（12種類）</text><rect x="510" y="80" width="400" height="340" rx="18" fill="#15120d" stroke="#8FB8D8" stroke-opacity=".7"/><text x="710" y="122" text-anchor="middle" font-family="serif" font-size="24" fill="#8FB8D8">サジュ（四柱推命）</text><text x="710" y="170" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#EEE7D7">生年月日（＋時間）</text><text x="710" y="214" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#D4B26C">↓</text><text x="710" y="258" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#EEE7D7">年・月・日・時の4つの柱</text><text x="710" y="302" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#EEE7D7">＝ 日主10タイプ／日柱60</text><text x="710" y="346" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#D4B26C">↓</text><text x="710" y="390" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#EEE7D7">五行バランス・相性・大運</text>
</svg>
