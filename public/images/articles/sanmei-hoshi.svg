<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-label="サジュの十神と算命学の十大主星の対応表。比肩は貫索星、劫財は石門星、食神は鳳閣星、傷官は調舒星、偏財は禄存星、正財は司禄星、偏官は車騎星、正官は牽牛星、偏印は龍高星、正印は玉堂星">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="470" fill="url(#bg)"/>
  <text x="480" y="40" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C" letter-spacing="3">サジュの「十神」と、算命学の「十大主星」</text><text x="300" y="78" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#D4B26C">サジュ（十神）</text><text x="660" y="78" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#b39ad6">算命学（十大主星）</text><rect x="220" y="96" width="160" height="28" rx="6" fill="#15120d" stroke="#5E9C80" stroke-opacity=".7"/><text x="300" y="116" text-anchor="middle" font-family="serif" font-size="17" fill="#EEE7D7">比肩</text><path d="M388 110 H572" stroke="#D4B26C" stroke-opacity=".4" stroke-dasharray="3 5"/><rect x="580" y="96" width="160" height="28" rx="6" fill="#15120d" stroke="#b39ad6" stroke-opacity=".7"/><text x="660" y="116" text-anchor="middle" font-family="serif" font-size="17" fill="#EEE7D7">貫索星</text><rect x="220" y="130" width="160" height="28" rx="6" fill="#15120d" stroke="#5E9C80" stroke-opacity=".7"/><text x="300" y="150" text-anchor="middle" font-family="serif" font-size="17" fill="#EEE7D7">劫財</text><path d="M388 144 H572" stroke="#D4B26C" stroke-opacity=".4" stroke-dasharray="3 5"/><rect x="580" y="130" width="160" height="28" rx="6" fill="#15120d" stroke="#b39ad6" stroke-opacity=".7"/><text x="660" y="150" text-anchor="middle" font-family="serif" font-size="17" fill="#EEE7D7">石門星</text><rect x="220" y="164" width="160" height="28" rx="6" fill="#15120d" stroke="#C9665B" stroke-opacity=".7"/><text x="300" y="184" text-anchor="middle" font-family="serif" font-size="17" fill="#EEE7D7">食神</text><path d="M388 178 H572" stroke="#D4B26C" stroke-opacity=".4" stroke-dasharray="3 5"/><rect x="580" y="164" width="160" height="28" rx="6" fill="#15120d" stroke="#b39ad6" stroke-opacity=".7"/><text x="660" y="184" text-anchor="middle" font-family="serif" font-size="17" fill="#EEE7D7">鳳閣星</text><rect x="220" y="198" width="160" height="28" rx="6" fill="#15120d" stroke="#C9665B" stroke-opacity=".7"/><text x="300" y="218" text-anchor="middle" font-family="serif" font-size="17" fill="#EEE7D7">傷官</text><path d="M388 212 H572" stroke="#D4B26C" stroke-opacity=".4" stroke-dasharray="3 5"/><rect x="580" y="198" width="160" height="28" rx="6" fill="#15120d" stroke="#b39ad6" stroke-opacity=".7"/><text x="660" y="218" text-anchor="middle" font-family="serif" font-size="17" fill="#EEE7D7">調舒星</text><rect x="220" y="232" width="160" height="28" rx="6" fill="#15120d" stroke="#D3A64A" stroke-opacity=".7"/><text x="300" y="252" text-anchor="middle" font-family="serif" font-size="17" fill="#EEE7D7">偏財</text><path d="M388 246 H572" stroke="#D4B26C" stroke-opacity=".4" stroke-dasharray="3 5"/><rect x="580" y="232" width="160" height="28" rx="6" fill="#15120d" stroke="#b39ad6" stroke-opacity=".7"/><text x="660" y="252" text-anchor="middle" font-family="serif" font-size="17" fill="#EEE7D7">禄存星</text><rect x="220" y="266" width="160" height="28" rx="6" fill="#15120d" stroke="#D3A64A" stroke-opacity=".7"/><text x="300" y="286" text-anchor="middle" font-family="serif" font-size="17" fill="#EEE7D7">正財</text><path d="M388 280 H572" stroke="#D4B26C" stroke-opacity=".4" stroke-dasharray="3 5"/><rect x="580" y="266" width="160" height="28" rx="6" fill="#15120d" stroke="#b39ad6" stroke-opacity=".7"/><text x="660" y="286" text-anchor="middle" font-family="serif" font-size="17" fill="#EEE7D7">司禄星</text><rect x="220" y="300" width="160" height="28" rx="6" fill="#15120d" stroke="#DCD8CC" stroke-opacity=".7"/><text x="300" y="320" text-anchor="middle" font-family="serif" font-size="17" fill="#EEE7D7">偏官</text><path d="M388 314 H572" stroke="#D4B26C" stroke-opacity=".4" stroke-dasharray="3 5"/><rect x="580" y="300" width="160" height="28" rx="6" fill="#15120d" stroke="#b39ad6" stroke-opacity=".7"/><text x="660" y="320" text-anchor="middle" font-family="serif" font-size="17" fill="#EEE7D7">車騎星</text><rect x="220" y="334" width="160" height="28" rx="6" fill="#15120d" stroke="#DCD8CC" stroke-opacity=".7"/><text x="300" y="354" text-anchor="middle" font-family="serif" font-size="17" fill="#EEE7D7">正官</text><path d="M388 348 H572" stroke="#D4B26C" stroke-opacity=".4" stroke-dasharray="3 5"/><rect x="580" y="334" width="160" height="28" rx="6" fill="#15120d" stroke="#b39ad6" stroke-opacity=".7"/><text x="660" y="354" text-anchor="middle" font-family="serif" font-size="17" fill="#EEE7D7">牽牛星</text><rect x="220" y="368" width="160" height="28" rx="6" fill="#15120d" stroke="#6178AE" stroke-opacity=".7"/><text x="300" y="388" text-anchor="middle" font-family="serif" font-size="17" fill="#EEE7D7">偏印</text><path d="M388 382 H572" stroke="#D4B26C" stroke-opacity=".4" stroke-dasharray="3 5"/><rect x="580" y="368" width="160" height="28" rx="6" fill="#15120d" stroke="#b39ad6" stroke-opacity=".7"/><text x="660" y="388" text-anchor="middle" font-family="serif" font-size="17" fill="#EEE7D7">龍高星</text><rect x="220" y="402" width="160" height="28" rx="6" fill="#15120d" stroke="#6178AE" stroke-opacity=".7"/><text x="300" y="422" text-anchor="middle" font-family="serif" font-size="17" fill="#EEE7D7">正印</text><path d="M388 416 H572" stroke="#D4B26C" stroke-opacity=".4" stroke-dasharray="3 5"/><rect x="580" y="402" width="160" height="28" rx="6" fill="#15120d" stroke="#b39ad6" stroke-opacity=".7"/><text x="660" y="422" text-anchor="middle" font-family="serif" font-size="17" fill="#EEE7D7">玉堂星</text><text x="480" y="452" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#EEE7D7" opacity=".75">名前はちがっても、同じ考え方（日主と他の干の五行の関係）から生まれた10の星です</text>
</svg>
