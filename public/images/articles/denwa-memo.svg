<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-label="相談の前に書いておくメモの例。今日いちばん聞きたいこと、ふたりの生年月日、今の状況、聞きたいことの順番">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="460" fill="url(#bg)"/>
  <rect x="200" y="40" width="560" height="380" rx="8" fill="#EEE7D7"/><text x="480" y="85" text-anchor="middle" font-family="serif" font-size="24" fill="#3a3346">相談メモ</text><circle cx="240" cy="130" r="7" fill="#C9665B"/><text x="258" y="136" text-anchor="start" font-family="sans-serif" font-size="19" fill="#3a3346">今日いちばん聞きたいこと</text><text x="258" y="164" text-anchor="start" font-family="sans-serif" font-size="15" fill="#7a7466">例：相手が私をどう思っているか</text><line x1="240" y1="178" x2="720" y2="178" stroke="#d8cfbb" stroke-dasharray="4 6"/><circle cx="240" cy="202" r="7" fill="#C9665B"/><text x="258" y="208" text-anchor="start" font-family="sans-serif" font-size="19" fill="#3a3346">ふたりの生年月日</text><text x="258" y="236" text-anchor="start" font-family="sans-serif" font-size="15" fill="#7a7466">例：わたし 1993/5/14、相手 1991/11/2</text><line x1="240" y1="250" x2="720" y2="250" stroke="#d8cfbb" stroke-dasharray="4 6"/><circle cx="240" cy="274" r="7" fill="#C9665B"/><text x="258" y="280" text-anchor="start" font-family="sans-serif" font-size="19" fill="#3a3346">今の状況</text><text x="258" y="308" text-anchor="start" font-family="sans-serif" font-size="15" fill="#7a7466">例：職場の同僚。半年前から2人で話すように</text><line x1="240" y1="322" x2="720" y2="322" stroke="#d8cfbb" stroke-dasharray="4 6"/><circle cx="240" cy="346" r="7" fill="#C9665B"/><text x="258" y="352" text-anchor="start" font-family="sans-serif" font-size="19" fill="#3a3346">時間が余ったら聞きたいこと</text><text x="258" y="380" text-anchor="start" font-family="sans-serif" font-size="15" fill="#7a7466">例：連絡するならいつがいいか</text><line x1="240" y1="394" x2="720" y2="394" stroke="#d8cfbb" stroke-dasharray="4 6"/>
</svg>
