<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="甲から癸までの10の天干と、子から亥までの12の地支を並べ、その組み合わせが甲子から癸亥までの60通りになることを示した図">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="440" fill="url(#bg)"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#D4B26C"/></marker></defs><text x="480" y="50" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C" letter-spacing="3">日柱は「10の天干」×「12の地支」の60通り</text><circle cx="120" cy="120" r="28" fill="none" stroke="#5E9C80"/><text x="120" y="131" text-anchor="middle" font-family="serif" font-size="28" fill="#5E9C80">甲</text><circle cx="200" cy="120" r="28" fill="none" stroke="#5E9C80"/><text x="200" y="131" text-anchor="middle" font-family="serif" font-size="28" fill="#5E9C80">乙</text><circle cx="280" cy="120" r="28" fill="none" stroke="#C9665B"/><text x="280" y="131" text-anchor="middle" font-family="serif" font-size="28" fill="#C9665B">丙</text><circle cx="360" cy="120" r="28" fill="none" stroke="#C9665B"/><text x="360" y="131" text-anchor="middle" font-family="serif" font-size="28" fill="#C9665B">丁</text><circle cx="440" cy="120" r="28" fill="none" stroke="#D3A64A"/><text x="440" y="131" text-anchor="middle" font-family="serif" font-size="28" fill="#D3A64A">戊</text><circle cx="520" cy="120" r="28" fill="none" stroke="#D3A64A"/><text x="520" y="131" text-anchor="middle" font-family="serif" font-size="28" fill="#D3A64A">己</text><circle cx="600" cy="120" r="28" fill="none" stroke="#DCD8CC"/><text x="600" y="131" text-anchor="middle" font-family="serif" font-size="28" fill="#DCD8CC">庚</text><circle cx="680" cy="120" r="28" fill="none" stroke="#DCD8CC"/><text x="680" y="131" text-anchor="middle" font-family="serif" font-size="28" fill="#DCD8CC">辛</text><circle cx="760" cy="120" r="28" fill="none" stroke="#6178AE"/><text x="760" y="131" text-anchor="middle" font-family="serif" font-size="28" fill="#6178AE">壬</text><circle cx="840" cy="120" r="28" fill="none" stroke="#6178AE"/><text x="840" y="131" text-anchor="middle" font-family="serif" font-size="28" fill="#6178AE">癸</text><rect x="90" y="190" width="52" height="52" rx="8" fill="none" stroke="#D4B26C" stroke-opacity=".6"/><text x="116" y="226" text-anchor="middle" font-family="serif" font-size="26" fill="#EEE7D7">子</text><rect x="156" y="190" width="52" height="52" rx="8" fill="none" stroke="#D4B26C" stroke-opacity=".6"/><text x="182" y="226" text-anchor="middle" font-family="serif" font-size="26" fill="#EEE7D7">丑</text><rect x="222" y="190" width="52" height="52" rx="8" fill="none" stroke="#D4B26C" stroke-opacity=".6"/><text x="248" y="226" text-anchor="middle" font-family="serif" font-size="26" fill="#EEE7D7">寅</text><rect x="288" y="190" width="52" height="52" rx="8" fill="none" stroke="#D4B26C" stroke-opacity=".6"/><text x="314" y="226" text-anchor="middle" font-family="serif" font-size="26" fill="#EEE7D7">卯</text><rect x="354" y="190" width="52" height="52" rx="8" fill="none" stroke="#D4B26C" stroke-opacity=".6"/><text x="380" y="226" text-anchor="middle" font-family="serif" font-size="26" fill="#EEE7D7">辰</text><rect x="420" y="190" width="52" height="52" rx="8" fill="none" stroke="#D4B26C" stroke-opacity=".6"/><text x="446" y="226" text-anchor="middle" font-family="serif" font-size="26" fill="#EEE7D7">巳</text><rect x="486" y="190" width="52" height="52" rx="8" fill="none" stroke="#D4B26C" stroke-opacity=".6"/><text x="512" y="226" text-anchor="middle" font-family="serif" font-size="26" fill="#EEE7D7">午</text><rect x="552" y="190" width="52" height="52" rx="8" fill="none" stroke="#D4B26C" stroke-opacity=".6"/><text x="578" y="226" text-anchor="middle" font-family="serif" font-size="26" fill="#EEE7D7">未</text><rect x="618" y="190" width="52" height="52" rx="8" fill="none" stroke="#D4B26C" stroke-opacity=".6"/><text x="644" y="226" text-anchor="middle" font-family="serif" font-size="26" fill="#EEE7D7">申</text><rect x="684" y="190" width="52" height="52" rx="8" fill="none" stroke="#D4B26C" stroke-opacity=".6"/><text x="710" y="226" text-anchor="middle" font-family="serif" font-size="26" fill="#EEE7D7">酉</text><rect x="750" y="190" width="52" height="52" rx="8" fill="none" stroke="#D4B26C" stroke-opacity=".6"/><text x="776" y="226" text-anchor="middle" font-family="serif" font-size="26" fill="#EEE7D7">戌</text><rect x="816" y="190" width="52" height="52" rx="8" fill="none" stroke="#D4B26C" stroke-opacity=".6"/><text x="842" y="226" text-anchor="middle" font-family="serif" font-size="26" fill="#EEE7D7">亥</text><path d="M480 260 V300" stroke="#D4B26C" marker-end="url(#ar)"/><text x="150" y="355" text-anchor="middle" font-family="serif" font-size="28" fill="#EEE7D7">甲子</text><text x="235" y="355" text-anchor="middle" font-family="serif" font-size="28" fill="#EEE7D7">乙丑</text><text x="320" y="355" text-anchor="middle" font-family="serif" font-size="28" fill="#EEE7D7">丙寅</text><text x="405" y="355" text-anchor="middle" font-family="serif" font-size="28" fill="#EEE7D7">丁卯</text><text x="490" y="355" text-anchor="middle" font-family="serif" font-size="28" fill="#EEE7D7">戊辰</text><text x="575" y="355" text-anchor="middle" font-family="serif" font-size="24" fill="#EEE7D7">…</text><text x="660" y="355" text-anchor="middle" font-family="serif" font-size="28" fill="#D4B26C">庚寅</text><text x="745" y="355" text-anchor="middle" font-family="serif" font-size="24" fill="#EEE7D7">…</text><text x="830" y="355" text-anchor="middle" font-family="serif" font-size="28" fill="#EEE7D7">癸亥</text><text x="480" y="410" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#EEE7D7" opacity=".85">陽の干は陽の支と、陰の干は陰の支と組むので、10×12＝120ではなく60通り</text>
</svg>
