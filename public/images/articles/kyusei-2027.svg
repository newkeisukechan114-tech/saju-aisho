<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-label="2027年の九星気学の年盤。中宮は九紫火星。北が五黄土星で五黄殺、南が四緑木星で暗剣殺、北東が三碧木星で歳破">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="460" fill="url(#bg)"/>
  <text x="480" y="40" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C" letter-spacing="3">2027年（2月4日から）の年盤　※上が南</text><rect x="240" y="62" width="155" height="108" rx="8" fill="#15120d" stroke="rgba(212,178,108,.45)" stroke-width="1.5"/><text x="317" y="86" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#EEE7D7" opacity=".7">南東</text><text x="317" y="124" text-anchor="middle" font-family="serif" font-size="22" fill="#D3A64A">八白土星</text><rect x="405" y="62" width="155" height="108" rx="8" fill="#15120d" stroke="#b0453a" stroke-width="2.5"/><text x="482" y="86" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#EEE7D7" opacity=".7">南</text><text x="482" y="124" text-anchor="middle" font-family="serif" font-size="22" fill="#5E9C80">四緑木星</text><text x="482" y="154" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#b0453a">暗剣殺</text><rect x="570" y="62" width="155" height="108" rx="8" fill="#15120d" stroke="rgba(212,178,108,.45)" stroke-width="1.5"/><text x="647" y="86" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#EEE7D7" opacity=".7">南西</text><text x="647" y="124" text-anchor="middle" font-family="serif" font-size="22" fill="#DCD8CC">六白金星</text><rect x="240" y="180" width="155" height="108" rx="8" fill="#15120d" stroke="rgba(212,178,108,.45)" stroke-width="1.5"/><text x="317" y="204" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#EEE7D7" opacity=".7">東</text><text x="317" y="242" text-anchor="middle" font-family="serif" font-size="22" fill="#DCD8CC">七赤金星</text><rect x="405" y="180" width="155" height="108" rx="8" fill="#15120d" stroke="#D4B26C" stroke-width="2.5"/><text x="482" y="204" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#EEE7D7" opacity=".7">中宮</text><text x="482" y="242" text-anchor="middle" font-family="serif" font-size="22" fill="#C9665B">九紫火星</text><rect x="570" y="180" width="155" height="108" rx="8" fill="#15120d" stroke="rgba(212,178,108,.45)" stroke-width="1.5"/><text x="647" y="204" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#EEE7D7" opacity=".7">西</text><text x="647" y="242" text-anchor="middle" font-family="serif" font-size="22" fill="#D3A64A">二黒土星</text><rect x="240" y="298" width="155" height="108" rx="8" fill="#15120d" stroke="#b0453a" stroke-width="2.5"/><text x="317" y="322" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#EEE7D7" opacity=".7">北東</text><text x="317" y="360" text-anchor="middle" font-family="serif" font-size="22" fill="#5E9C80">三碧木星</text><text x="317" y="390" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#b0453a">歳破</text><rect x="405" y="298" width="155" height="108" rx="8" fill="#15120d" stroke="#b0453a" stroke-width="2.5"/><text x="482" y="322" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#EEE7D7" opacity=".7">北</text><text x="482" y="360" text-anchor="middle" font-family="serif" font-size="22" fill="#D3A64A">五黄土星</text><text x="482" y="390" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#b0453a">五黄殺</text><rect x="570" y="298" width="155" height="108" rx="8" fill="#15120d" stroke="rgba(212,178,108,.45)" stroke-width="1.5"/><text x="647" y="322" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#EEE7D7" opacity=".7">北西</text><text x="647" y="360" text-anchor="middle" font-family="serif" font-size="22" fill="#6178AE">一白水星</text><text x="480" y="440" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#EEE7D7" opacity=".8">本命殺・本命的殺は、生まれ年の星（本命星）によって変わります</text>
</svg>
