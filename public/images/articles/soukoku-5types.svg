<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-label="相剋の5つの組み合わせと、間をつなぐ五行の一覧。木と土は火、土と水は金、水と火は木、火と金は土、金と木は水がつなぐ">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="560" fill="url(#bg)"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#D4B26C"/></marker></defs><text x="480" y="50" text-anchor="middle" font-family="serif" font-size="24" fill="#D4B26C" letter-spacing="4">相剋の5つの組み合わせと、つなぐ五行</text><rect x="60" y="80" width="840" height="78" rx="10" fill="#15120d" stroke="rgba(212,178,108,.35)"/>
  <circle cx="110" cy="119" r="26" fill="none" stroke="#5E9C80" stroke-width="3"/><text x="110" y="129" text-anchor="middle" font-family="serif" font-size="28" fill="#5E9C80">木</text>
  <text x="152" y="127" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#EEE7D7">×</text>
  <circle cx="194" cy="119" r="26" fill="none" stroke="#D3A64A" stroke-width="3"/><text x="194" y="129" text-anchor="middle" font-family="serif" font-size="28" fill="#D3A64A">土</text>
  <path d="M240 119 L330 119" stroke="#D4B26C" stroke-width="2" marker-end="url(#ar)"/>
  <circle cx="370" cy="119" r="26" fill="#C9665B" opacity=".25"/><circle cx="370" cy="119" r="26" fill="none" stroke="#C9665B" stroke-width="3"/><text x="370" y="129" text-anchor="middle" font-family="serif" font-size="28" fill="#C9665B">火</text>
  <text x="420" y="112" font-family="sans-serif" font-size="14" fill="#D4B26C">間をつなぐのは</text>
  <text x="420" y="138" font-family="sans-serif" font-size="20" fill="#EEE7D7">「一緒に楽しむ時間」を増やす</text><rect x="60" y="172" width="840" height="78" rx="10" fill="#15120d" stroke="rgba(212,178,108,.35)"/>
  <circle cx="110" cy="211" r="26" fill="none" stroke="#D3A64A" stroke-width="3"/><text x="110" y="221" text-anchor="middle" font-family="serif" font-size="28" fill="#D3A64A">土</text>
  <text x="152" y="219" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#EEE7D7">×</text>
  <circle cx="194" cy="211" r="26" fill="none" stroke="#6178AE" stroke-width="3"/><text x="194" y="221" text-anchor="middle" font-family="serif" font-size="28" fill="#6178AE">水</text>
  <path d="M240 211 L330 211" stroke="#D4B26C" stroke-width="2" marker-end="url(#ar)"/>
  <circle cx="370" cy="211" r="26" fill="#DCD8CC" opacity=".25"/><circle cx="370" cy="211" r="26" fill="none" stroke="#DCD8CC" stroke-width="3"/><text x="370" y="221" text-anchor="middle" font-family="serif" font-size="28" fill="#DCD8CC">金</text>
  <text x="420" y="204" font-family="sans-serif" font-size="14" fill="#D4B26C">間をつなぐのは</text>
  <text x="420" y="230" font-family="sans-serif" font-size="20" fill="#EEE7D7">「ルールと約束」を増やす</text><rect x="60" y="264" width="840" height="78" rx="10" fill="#15120d" stroke="rgba(212,178,108,.35)"/>
  <circle cx="110" cy="303" r="26" fill="none" stroke="#6178AE" stroke-width="3"/><text x="110" y="313" text-anchor="middle" font-family="serif" font-size="28" fill="#6178AE">水</text>
  <text x="152" y="311" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#EEE7D7">×</text>
  <circle cx="194" cy="303" r="26" fill="none" stroke="#C9665B" stroke-width="3"/><text x="194" y="313" text-anchor="middle" font-family="serif" font-size="28" fill="#C9665B">火</text>
  <path d="M240 303 L330 303" stroke="#D4B26C" stroke-width="2" marker-end="url(#ar)"/>
  <circle cx="370" cy="303" r="26" fill="#5E9C80" opacity=".25"/><circle cx="370" cy="303" r="26" fill="none" stroke="#5E9C80" stroke-width="3"/><text x="370" y="313" text-anchor="middle" font-family="serif" font-size="28" fill="#5E9C80">木</text>
  <text x="420" y="296" font-family="sans-serif" font-size="14" fill="#D4B26C">間をつなぐのは</text>
  <text x="420" y="322" font-family="sans-serif" font-size="20" fill="#EEE7D7">「新しい挑戦」を増やす</text><rect x="60" y="356" width="840" height="78" rx="10" fill="#15120d" stroke="rgba(212,178,108,.35)"/>
  <circle cx="110" cy="395" r="26" fill="none" stroke="#C9665B" stroke-width="3"/><text x="110" y="405" text-anchor="middle" font-family="serif" font-size="28" fill="#C9665B">火</text>
  <text x="152" y="403" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#EEE7D7">×</text>
  <circle cx="194" cy="395" r="26" fill="none" stroke="#DCD8CC" stroke-width="3"/><text x="194" y="405" text-anchor="middle" font-family="serif" font-size="28" fill="#DCD8CC">金</text>
  <path d="M240 395 L330 395" stroke="#D4B26C" stroke-width="2" marker-end="url(#ar)"/>
  <circle cx="370" cy="395" r="26" fill="#D3A64A" opacity=".25"/><circle cx="370" cy="395" r="26" fill="none" stroke="#D3A64A" stroke-width="3"/><text x="370" y="405" text-anchor="middle" font-family="serif" font-size="28" fill="#D3A64A">土</text>
  <text x="420" y="388" font-family="sans-serif" font-size="14" fill="#D4B26C">間をつなぐのは</text>
  <text x="420" y="414" font-family="sans-serif" font-size="20" fill="#EEE7D7">「落ち着ける場所」を増やす</text><rect x="60" y="448" width="840" height="78" rx="10" fill="#15120d" stroke="rgba(212,178,108,.35)"/>
  <circle cx="110" cy="487" r="26" fill="none" stroke="#DCD8CC" stroke-width="3"/><text x="110" y="497" text-anchor="middle" font-family="serif" font-size="28" fill="#DCD8CC">金</text>
  <text x="152" y="495" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#EEE7D7">×</text>
  <circle cx="194" cy="487" r="26" fill="none" stroke="#5E9C80" stroke-width="3"/><text x="194" y="497" text-anchor="middle" font-family="serif" font-size="28" fill="#5E9C80">木</text>
  <path d="M240 487 L330 487" stroke="#D4B26C" stroke-width="2" marker-end="url(#ar)"/>
  <circle cx="370" cy="487" r="26" fill="#6178AE" opacity=".25"/><circle cx="370" cy="487" r="26" fill="none" stroke="#6178AE" stroke-width="3"/><text x="370" y="497" text-anchor="middle" font-family="serif" font-size="28" fill="#6178AE">水</text>
  <text x="420" y="480" font-family="sans-serif" font-size="14" fill="#D4B26C">間をつなぐのは</text>
  <text x="420" y="506" font-family="sans-serif" font-size="20" fill="#EEE7D7">「ゆっくり話す時間」を増やす</text>
</svg>
