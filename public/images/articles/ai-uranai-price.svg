<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-label="料金の比較：AIのサジュ占い約7000ウォン、AI人相占い約8000ウォン、対面の相談は約10万ウォン">
  <rect width="960" height="300" fill="#0b0a08"/>
  <g font-family="sans-serif" font-size="15" fill="#D4B26C">
    <text x="40" y="78">AIのサジュ占い</text>
    <rect x="240" y="60" width="47" height="26" fill="#D4B26C"/><text x="300" y="79">約7,000ウォン</text>
    <text x="40" y="138">AIの人相占い</text>
    <rect x="240" y="120" width="54" height="26" fill="#D4B26C"/><text x="307" y="139">約8,000ウォン</text>
    <text x="40" y="198">対面の相談（目安）</text>
    <rect x="240" y="180" width="670" height="26" fill="none" stroke="#D4B26C" stroke-width="1.5"/><text x="780" y="199">約10万ウォン</text>
  </g>
  <text x="480" y="262" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#D4B26C" fill-opacity=".6">2026年春の韓国の報道をもとに作成。料金は変わることがあります。</text>
</svg>
