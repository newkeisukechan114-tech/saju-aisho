<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-label="血液型占いとサジュを、タイプの数・使う情報・時期を見るか・相性の見方・得意なことの5項目でくらべた表">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="430" fill="url(#bg)"/>
  <text x="480" y="46" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C" letter-spacing="3">血液型占いとサジュ、ここがちがう</text><rect x="60" y="72" width="840" height="44" fill="#D4B26C" opacity=".16"/><text x="200" y="101" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#D4B26C"></text><text x="400" y="101" text-anchor="middle" font-family="serif" font-size="19" fill="#d98c96">血液型占い</text><text x="700" y="101" text-anchor="middle" font-family="serif" font-size="19" fill="#D4B26C">サジュ（四柱推命）</text><path d="M60 174 H900" stroke="#D4B26C" stroke-opacity=".2"/><text x="80" y="152" font-family="sans-serif" font-size="15" fill="#D4B26C">タイプの数</text><text x="400" y="152" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#EEE7D7">4つ</text><text x="700" y="152" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#EEE7D7">日主だけで10、命式全体はもっと細かい</text><path d="M60 232 H900" stroke="#D4B26C" stroke-opacity=".2"/><text x="80" y="210" font-family="sans-serif" font-size="15" fill="#D4B26C">使う情報</text><text x="400" y="210" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#EEE7D7">血液の型</text><text x="700" y="210" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#EEE7D7">生年月日（わかれば生まれた時間も）</text><path d="M60 290 H900" stroke="#D4B26C" stroke-opacity=".2"/><text x="80" y="268" font-family="sans-serif" font-size="15" fill="#D4B26C">時期を見る？</text><text x="400" y="268" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#EEE7D7">見ない</text><text x="700" y="268" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#EEE7D7">年・月ごとの運の流れを見る</text><path d="M60 348 H900" stroke="#D4B26C" stroke-opacity=".2"/><text x="80" y="326" font-family="sans-serif" font-size="15" fill="#D4B26C">相性の見方</text><text x="400" y="326" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#EEE7D7">型どうしの組み合わせ</text><text x="700" y="326" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#EEE7D7">五行の「生かし合い・ぶつかり合い」</text><path d="M60 406 H900" stroke="#D4B26C" stroke-opacity=".2"/><text x="80" y="384" font-family="sans-serif" font-size="15" fill="#D4B26C">得意なこと</text><text x="400" y="384" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#EEE7D7">初対面の話題づくり</text><text x="700" y="384" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#EEE7D7">自分の性質と、動きやすい時期を知る</text>
</svg>
