<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="「サジュの二つ名」のカード見本3枚。庚子は冬の夜に迷いを断つ鋼、辛丑は雪どけを待ちながら静かにきらめく宝石、庚寅は春の芽吹きとともに迷いを断つ鋼">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="400" fill="url(#bg)"/>
  <g transform="translate(90 60)"><rect width="220" height="280" rx="10" fill="#9AA3AD"/><text x="18" y="34" font-family="serif" font-size="11" fill="#1c1712" opacity=".8">庚子の日に生まれたあなたの二つ名</text><text x="18" y="80" font-family="serif" font-size="14" fill="#1c1712">冬の夜に</text><text x="18" y="112" font-family="serif" font-size="22" font-weight="700" fill="#1c1712">迷いを断つ</text><text x="18" y="142" font-family="serif" font-size="22" font-weight="700" fill="#1c1712">鋼</text><rect x="18" y="170" width="184" height="60" rx="8" fill="#fff" opacity=".85"/><circle cx="42" cy="200" r="12" fill="#9AA3AD" stroke="#0002"/><text x="60" y="205" font-family="serif" font-size="13" fill="#1c1712">銀鼠</text><circle cx="122" cy="200" r="12" fill="#1F2A44" stroke="#0002"/><text x="140" y="205" font-family="serif" font-size="13" fill="#1c1712">夜紺</text><text x="18" y="262" font-family="serif" font-size="13" fill="#1c1712">引き合う干支　乙丑</text></g><g transform="translate(370 60)"><rect width="220" height="280" rx="10" fill="#E8E2D6"/><text x="18" y="34" font-family="serif" font-size="11" fill="#1c1712" opacity=".8">辛丑の日に生まれたあなたの二つ名</text><text x="18" y="80" font-family="serif" font-size="14" fill="#1c1712">雪どけを待ちながら</text><text x="18" y="112" font-family="serif" font-size="22" font-weight="700" fill="#1c1712">静かにきらめく</text><text x="18" y="142" font-family="serif" font-size="22" font-weight="700" fill="#1c1712">宝石</text><rect x="18" y="170" width="184" height="60" rx="8" fill="#fff" opacity=".85"/><circle cx="42" cy="200" r="12" fill="#E8E2D6" stroke="#0002"/><text x="60" y="205" font-family="serif" font-size="13" fill="#1c1712">真珠</text><circle cx="122" cy="200" r="12" fill="#EDE6D6" stroke="#0002"/><text x="140" y="205" font-family="serif" font-size="13" fill="#1c1712">雪白</text><text x="18" y="262" font-family="serif" font-size="13" fill="#1c1712">引き合う干支　丙子</text></g><g transform="translate(650 60)"><rect width="220" height="280" rx="10" fill="#9AA3AD"/><text x="18" y="34" font-family="serif" font-size="11" fill="#1c1712" opacity=".8">庚寅の日に生まれたあなたの二つ名</text><text x="18" y="80" font-family="serif" font-size="14" fill="#1c1712">春の芽吹きとともに</text><text x="18" y="112" font-family="serif" font-size="22" font-weight="700" fill="#1c1712">迷いを断つ</text><text x="18" y="142" font-family="serif" font-size="22" font-weight="700" fill="#1c1712">鋼</text><rect x="18" y="170" width="184" height="60" rx="8" fill="#fff" opacity=".85"/><circle cx="42" cy="200" r="12" fill="#9AA3AD" stroke="#0002"/><text x="60" y="205" font-family="serif" font-size="13" fill="#1c1712">銀鼠</text><circle cx="122" cy="200" r="12" fill="#6B8E4E" stroke="#0002"/><text x="140" y="205" font-family="serif" font-size="13" fill="#1c1712">若竹</text><text x="18" y="262" font-family="serif" font-size="13" fill="#1c1712">引き合う干支　乙亥</text></g><text x="480.0" y="380" text-anchor="middle" font-family="serif" font-size="21" fill="#D4B26C" letter-spacing="5">Threadsで毎日、その日の干支の二つ名を届けています</text>
</svg>
