<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-label="十二支が円に並び、そのうち「午」と「未」の2つだけが暗く欠けて見える輪のイラスト">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="480" fill="url(#bg)"/>
  
  <circle cx="480" cy="225" r="250" fill="url(#g)"/>
  <circle cx="480" cy="225" r="150" fill="none" stroke="#D4B26C" stroke-opacity=".3"/><circle cx="480" cy="75" r="30" fill="#15120d" stroke="#D4B26C" stroke-opacity="0.8" stroke-width="2" /><text x="480" y="85" text-anchor="middle" font-family="serif" font-size="28" fill="#EEE7D7" opacity="1">子</text><circle cx="555" cy="95" r="30" fill="#15120d" stroke="#D4B26C" stroke-opacity="0.8" stroke-width="2" /><text x="555" y="105" text-anchor="middle" font-family="serif" font-size="28" fill="#EEE7D7" opacity="1">丑</text><circle cx="610" cy="150" r="30" fill="#15120d" stroke="#D4B26C" stroke-opacity="0.8" stroke-width="2" /><text x="610" y="160" text-anchor="middle" font-family="serif" font-size="28" fill="#EEE7D7" opacity="1">寅</text><circle cx="630" cy="225" r="30" fill="#15120d" stroke="#D4B26C" stroke-opacity="0.8" stroke-width="2" /><text x="630" y="235" text-anchor="middle" font-family="serif" font-size="28" fill="#EEE7D7" opacity="1">卯</text><circle cx="610" cy="300" r="30" fill="#15120d" stroke="#D4B26C" stroke-opacity="0.8" stroke-width="2" /><text x="610" y="310" text-anchor="middle" font-family="serif" font-size="28" fill="#EEE7D7" opacity="1">辰</text><circle cx="555" cy="355" r="30" fill="#15120d" stroke="#D4B26C" stroke-opacity="0.8" stroke-width="2" /><text x="555" y="365" text-anchor="middle" font-family="serif" font-size="28" fill="#EEE7D7" opacity="1">巳</text><circle cx="480" cy="375" r="30" fill="#0b0a0e" stroke="#D4B26C" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4 5"/><text x="480" y="385" text-anchor="middle" font-family="serif" font-size="28" fill="#EEE7D7" opacity="0.25">午</text><circle cx="405" cy="355" r="30" fill="#0b0a0e" stroke="#D4B26C" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4 5"/><text x="405" y="365" text-anchor="middle" font-family="serif" font-size="28" fill="#EEE7D7" opacity="0.25">未</text><circle cx="350" cy="300" r="30" fill="#15120d" stroke="#D4B26C" stroke-opacity="0.8" stroke-width="2" /><text x="350" y="310" text-anchor="middle" font-family="serif" font-size="28" fill="#EEE7D7" opacity="1">申</text><circle cx="330" cy="225" r="30" fill="#15120d" stroke="#D4B26C" stroke-opacity="0.8" stroke-width="2" /><text x="330" y="235" text-anchor="middle" font-family="serif" font-size="28" fill="#EEE7D7" opacity="1">酉</text><circle cx="350" cy="150" r="30" fill="#15120d" stroke="#D4B26C" stroke-opacity="0.8" stroke-width="2" /><text x="350" y="160" text-anchor="middle" font-family="serif" font-size="28" fill="#EEE7D7" opacity="1">戌</text><circle cx="405" cy="95" r="30" fill="#15120d" stroke="#D4B26C" stroke-opacity="0.8" stroke-width="2" /><text x="405" y="105" text-anchor="middle" font-family="serif" font-size="28" fill="#EEE7D7" opacity="1">亥</text>
  <text x="480" y="218" text-anchor="middle" font-family="serif" font-size="26" fill="#D4B26C">十二支</text><text x="480" y="250" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#EEE7D7" opacity=".8">2つだけ、欠けている</text>
  <text x="480.0" y="456" text-anchor="middle" font-family="serif" font-size="21" fill="#D4B26C" letter-spacing="5">12年のうち2年の「調整期間」</text>
</svg>
