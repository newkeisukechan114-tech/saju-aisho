<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-label="サジュカフェに行く前のチェックリスト。生年月日と生まれた時間、陽暦か陰暦か、聞きたい質問、通訳の有無、料金と時間の5項目">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="430" fill="url(#bg)"/>
  <text x="480" y="50" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C" letter-spacing="3">サジュカフェに行く前のチェックリスト</text><rect x="180" y="80" width="600" height="320" rx="14" fill="#F3EAD6"/><rect x="220" y="108" width="28" height="28" rx="5" fill="none" stroke="#2B2118" stroke-width="2"/><path d="M226 122 l8 8 l14 -16" stroke="#b0453a" stroke-width="3" fill="none"/><text x="268" y="130" font-family="sans-serif" font-size="19" fill="#2B2118">生年月日（できれば生まれた時間も）</text><rect x="220" y="164" width="28" height="28" rx="5" fill="none" stroke="#2B2118" stroke-width="2"/><path d="M226 178 l8 8 l14 -16" stroke="#b0453a" stroke-width="3" fill="none"/><text x="268" y="186" font-family="sans-serif" font-size="19" fill="#2B2118">陽暦か陰暦か</text><rect x="220" y="220" width="28" height="28" rx="5" fill="none" stroke="#2B2118" stroke-width="2"/><path d="M226 234 l8 8 l14 -16" stroke="#b0453a" stroke-width="3" fill="none"/><text x="268" y="242" font-family="sans-serif" font-size="19" fill="#2B2118">いちばん聞きたい質問を1〜2個</text><rect x="220" y="276" width="28" height="28" rx="5" fill="none" stroke="#2B2118" stroke-width="2"/><path d="M226 290 l8 8 l14 -16" stroke="#b0453a" stroke-width="3" fill="none"/><text x="268" y="298" font-family="sans-serif" font-size="19" fill="#2B2118">通訳の有無・言語を事前に確認</text><rect x="220" y="332" width="28" height="28" rx="5" fill="none" stroke="#2B2118" stroke-width="2"/><path d="M226 346 l8 8 l14 -16" stroke="#b0453a" stroke-width="3" fill="none"/><text x="268" y="354" font-family="sans-serif" font-size="19" fill="#2B2118">料金と時間（30分・1時間など）を確認</text>
</svg>
