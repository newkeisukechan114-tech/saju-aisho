<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-label="1992年5月14日生まれの例。数秘術は数字をたして運命数4、サジュは年・月・日を干支の壬申・乙巳・庚寅に置きかえる">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="430" fill="url(#bg)"/>
  <text x="480" y="46" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C" letter-spacing="3">1992年5月14日生まれの場合</text><rect x="50" y="80" width="400" height="300" rx="12" fill="#15120d" stroke="#8a6fb0" stroke-width="2"/><text x="250" y="120" text-anchor="middle" font-family="serif" font-size="24" fill="#b39ad6">数秘術</text><text x="250" y="170" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#EEE7D7">1+9+9+2+5+1+4 = 31</text><text x="250" y="210" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#EEE7D7">3+1 = 4</text><circle cx="250" cy="275" r="38" fill="none" stroke="#b39ad6" stroke-width="3"/><text x="250" y="288" text-anchor="middle" font-family="serif" font-size="36" fill="#b39ad6">4</text><text x="250" y="352" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#EEE7D7">数字をたして、ひとつの「運命数」に</text><rect x="510" y="80" width="400" height="300" rx="12" fill="#15120d" stroke="#D4B26C" stroke-width="2"/><text x="710" y="120" text-anchor="middle" font-family="serif" font-size="24" fill="#D4B26C">サジュ</text><text x="590" y="160" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#EEE7D7">年</text><rect x="552" y="172" width="76" height="130" rx="8" fill="#1d1824" stroke="rgba(212,178,108,.35)"/><text x="590" y="226" text-anchor="middle" font-family="serif" font-size="36" fill="#6178AE">壬</text><text x="590" y="282" text-anchor="middle" font-family="serif" font-size="32" fill="#EEE7D7">申</text><text x="710" y="160" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#EEE7D7">月</text><rect x="672" y="172" width="76" height="130" rx="8" fill="#1d1824" stroke="rgba(212,178,108,.35)"/><text x="710" y="226" text-anchor="middle" font-family="serif" font-size="36" fill="#5E9C80">乙</text><text x="710" y="282" text-anchor="middle" font-family="serif" font-size="32" fill="#EEE7D7">巳</text><text x="830" y="160" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#EEE7D7">日</text><rect x="792" y="172" width="76" height="130" rx="8" fill="#1d1824" stroke="#D4B26C" stroke-width="3"/><text x="830" y="226" text-anchor="middle" font-family="serif" font-size="36" fill="#DCD8CC">庚</text><text x="830" y="282" text-anchor="middle" font-family="serif" font-size="32" fill="#EEE7D7">寅</text><text x="710" y="352" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#EEE7D7">干支に置きかえて、五行のバランスを読む</text><text x="480" y="410" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#EEE7D7" opacity=".75">※サジュは生まれた時間がわかると「時」の柱も加わります。日の干「庚」が、この人の日主です</text>
</svg>
