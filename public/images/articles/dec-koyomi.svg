<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="暦のタイムライン。12月6日までは己亥の月、12月7日の大雪から1月4日までが庚子の月、1月5日から辛丑の月。12月22日に冬至">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="400" fill="url(#bg)"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#D4B26C"/></marker></defs><text x="480" y="46" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C" letter-spacing="3">サジュの「12月」は、12月7日から</text><path d="M60 200 H900" stroke="#EEE7D7" stroke-width="2" marker-end="url(#ar)"/><rect x="60" y="150" width="150" height="100" rx="8" fill="#1d1824" stroke="rgba(212,178,108,.35)"/><text x="135" y="195" text-anchor="middle" font-family="serif" font-size="22" fill="#EEE7D7" opacity=".7">己亥の月</text><text x="135" y="225" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7" opacity=".7">〜12月6日</text><rect x="230" y="140" width="540" height="120" rx="10" fill="#15120d" stroke="#D4B26C" stroke-width="2.5"/><text x="500" y="190" text-anchor="middle" font-family="serif" font-size="30" fill="#D4B26C">庚子（かのえね）の月</text><text x="500" y="228" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#EEE7D7">12月7日（大雪）〜 1月4日</text><rect x="790" y="150" width="110" height="100" rx="8" fill="#1d1824" stroke="rgba(212,178,108,.35)"/><text x="845" y="195" text-anchor="middle" font-family="serif" font-size="20" fill="#EEE7D7" opacity=".7">辛丑の月</text><text x="845" y="225" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#EEE7D7" opacity=".7">1月5日〜</text><path d="M560 260 V300" stroke="#b0453a" stroke-width="2"/><circle cx="560" cy="304" r="6" fill="#b0453a"/><text x="560" y="334" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#EEE7D7">12月22日 冬至</text><text x="480" y="378" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7" opacity=".8">月の切りかわりは、二十四節気の「節入り」の日。カレンダーの1日とは少しずれます</text>
</svg>
