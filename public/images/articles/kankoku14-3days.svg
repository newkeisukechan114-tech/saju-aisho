<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="2月14日は女性から男性へチョコ、3月14日は男性から女性へキャンディ、4月14日は恋人のいない人どうしでジャージャー麺を食べる、という3つの日の関係を描いた図">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="360" fill="url(#bg)"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#D4B26C"/></marker></defs><text x="480" y="48" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C" letter-spacing="3">2月・3月・4月は「3つでひとまとまり」</text><rect x="60" y="80" width="260" height="250" rx="12" fill="#15120d" stroke="#D4B26C" stroke-opacity=".5"/><text x="190" y="118" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C">2月14日</text><text x="190" y="146" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7" opacity=".8">バレンタイン</text><circle cx="120" cy="200" r="16" fill="#d98c96" opacity=".85"/><path d="M96 248 q0 -28 24 -28 q24 0 24 28" fill="#d98c96" opacity=".85"/><path d="M150 215 H210" stroke="#D4B26C" stroke-width="2" marker-end="url(#ar)"/><circle cx="250" cy="200" r="16" fill="#7FA7C9" opacity=".85"/><path d="M226 248 q0 -28 24 -28 q24 0 24 28" fill="#7FA7C9" opacity=".85"/><text x="190" y="300" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7">女性 → 男性（チョコ）</text><rect x="350" y="80" width="260" height="250" rx="12" fill="#15120d" stroke="#D4B26C" stroke-opacity=".5"/><text x="480" y="118" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C">3月14日</text><text x="480" y="146" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7" opacity=".8">ホワイトデー</text><circle cx="410" cy="200" r="16" fill="#d98c96" opacity=".85"/><path d="M386 248 q0 -28 24 -28 q24 0 24 28" fill="#d98c96" opacity=".85"/><path d="M500 215 H440" stroke="#D4B26C" stroke-width="2" marker-end="url(#ar)"/><circle cx="540" cy="200" r="16" fill="#7FA7C9" opacity=".85"/><path d="M516 248 q0 -28 24 -28 q24 0 24 28" fill="#7FA7C9" opacity=".85"/><text x="480" y="300" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7">男性 → 女性（キャンディ）</text><rect x="640" y="80" width="260" height="250" rx="12" fill="#15120d" stroke="#D4B26C" stroke-opacity=".5"/><text x="770" y="118" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C">4月14日</text><text x="770" y="146" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7" opacity=".8">ブラックデー</text><circle cx="720" cy="200" r="16" fill="#666" opacity=".85"/><path d="M696 248 q0 -28 24 -28 q24 0 24 28" fill="#666" opacity=".85"/><circle cx="820" cy="200" r="16" fill="#666" opacity=".85"/><path d="M796 248 q0 -28 24 -28 q24 0 24 28" fill="#666" opacity=".85"/><ellipse cx="770" cy="262" rx="40" ry="10" fill="#2a2216" stroke="#D4B26C"/><text x="770" y="300" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7">ひとり同士でジャージャー麺</text>
</svg>
