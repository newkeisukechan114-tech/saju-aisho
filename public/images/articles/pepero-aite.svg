<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-label="友だち・同僚、気になる人、恋人・パートナーの3つの相手別に、お菓子に添えるひとことの例">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="380" fill="url(#bg)"/>
  <rect x="45" y="60" width="270" height="270" rx="12" fill="#15120d" stroke="rgba(212,178,108,.35)"/>
  <text x="180" y="105" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C">友だち・同僚</text>
  <g><circle cx="150" cy="140" r="9" fill="#D4B26C"/><circle cx="180" cy="140" r="9" fill="rgba(238,231,215,.15)"/><circle cx="210" cy="140" r="9" fill="rgba(238,231,215,.15)"/></g>
  <text x="180" y="200" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#EEE7D7">「今日ポッキーの日</text><text x="180" y="230" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#EEE7D7">だから、おすそわけ」</text><rect x="345" y="60" width="270" height="270" rx="12" fill="#15120d" stroke="rgba(212,178,108,.35)"/>
  <text x="480" y="105" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C">気になる人</text>
  <g><circle cx="450" cy="140" r="9" fill="#e98aa0"/><circle cx="480" cy="140" r="9" fill="#e98aa0"/><circle cx="510" cy="140" r="9" fill="rgba(238,231,215,.15)"/></g>
  <text x="480" y="200" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#EEE7D7">「○○さんに</text><text x="480" y="230" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#EEE7D7">渡したくて」</text><rect x="645" y="60" width="270" height="270" rx="12" fill="#15120d" stroke="rgba(212,178,108,.35)"/>
  <text x="780" y="105" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C">恋人・パートナー</text>
  <g><circle cx="750" cy="140" r="9" fill="#C9665B"/><circle cx="780" cy="140" r="9" fill="#C9665B"/><circle cx="810" cy="140" r="9" fill="#C9665B"/></g>
  <text x="780" y="200" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#EEE7D7">「いつもありがとう。</text><text x="780" y="230" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#EEE7D7">一緒に食べよう」</text><text x="480.0" y="362" text-anchor="middle" font-family="serif" font-size="21" fill="#D4B26C" letter-spacing="5">ひとことの温度感</text>
</svg>
