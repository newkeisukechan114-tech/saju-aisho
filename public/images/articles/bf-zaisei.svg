<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-label="正財と偏財の違いを左右に並べた図。正財はコツコツ守るお金、偏財は動いて回すお金">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="430" fill="url(#bg)"/>
  <text x="480" y="48" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C" letter-spacing="3">サジュで見る、ふたつのお金の流れ</text><rect x="70" y="80" width="380" height="290" rx="12" fill="#15120d" stroke="#5E9C80" stroke-opacity=".7" stroke-width="2"/><text x="260" y="124" text-anchor="middle" font-family="serif" font-size="26" fill="#5E9C80">正財（せいざい）</text><text x="260" y="152" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#EEE7D7" opacity=".85">コツコツ守るお金</text><circle cx="110" cy="196" r="6" fill="#5E9C80"/><text x="130" y="202" font-family="sans-serif" font-size="18" fill="#EEE7D7">決まった収入・貯金</text><circle cx="110" cy="242" r="6" fill="#5E9C80"/><text x="130" y="248" font-family="sans-serif" font-size="18" fill="#EEE7D7">長く使う必要な物</text><circle cx="110" cy="288" r="6" fill="#5E9C80"/><text x="130" y="294" font-family="sans-serif" font-size="18" fill="#EEE7D7">比べてから買う</text><circle cx="110" cy="334" r="6" fill="#5E9C80"/><text x="130" y="340" font-family="sans-serif" font-size="18" fill="#EEE7D7">「元をとる」満足</text><rect x="510" y="80" width="380" height="290" rx="12" fill="#15120d" stroke="#C9A55C" stroke-opacity=".7" stroke-width="2"/><text x="700" y="124" text-anchor="middle" font-family="serif" font-size="26" fill="#C9A55C">偏財（へんざい）</text><text x="700" y="152" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#EEE7D7" opacity=".85">動いて回すお金</text><circle cx="550" cy="196" r="6" fill="#C9A55C"/><text x="570" y="202" font-family="sans-serif" font-size="18" fill="#EEE7D7">臨時収入・副業</text><circle cx="550" cy="242" r="6" fill="#C9A55C"/><text x="570" y="248" font-family="sans-serif" font-size="18" fill="#EEE7D7">楽しみ・人へのごちそう</text><circle cx="550" cy="288" r="6" fill="#C9A55C"/><text x="570" y="294" font-family="sans-serif" font-size="18" fill="#EEE7D7">その場のひらめき</text><circle cx="550" cy="334" r="6" fill="#C9A55C"/><text x="570" y="340" font-family="sans-serif" font-size="18" fill="#EEE7D7">「出会えた」満足</text><text x="480" y="410" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7" opacity=".8">どちらが良い・悪いではなく、自分に多いほうを知っておくと、買い物の後悔が減ります</text>
</svg>
