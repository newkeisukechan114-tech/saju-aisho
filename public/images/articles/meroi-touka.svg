<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-label="桃花の見つけ方の表。日支が申・子・辰なら酉、寅・午・戌なら卯、巳・酉・丑なら午、亥・卯・未なら子が桃花になる">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="470" fill="url(#bg)"/>
  <text x="480" y="48" text-anchor="middle" font-family="serif" font-size="23" fill="#D4B26C" letter-spacing="3">魅力の星「桃花（とうか）」の見つけ方</text><text x="270" y="100" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#D4B26C">日柱の地支（日支）が</text><text x="690" y="100" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#D4B26C">桃花になる地支</text><rect x="110" y="120" width="320" height="56" rx="10" fill="#15120d" stroke="rgba(212,178,108,.4)"/><text x="270" y="157" text-anchor="middle" font-family="serif" font-size="24" fill="#EEE7D7">申・子・辰</text><path d="M450 148 H520" stroke="#E59AA8" stroke-width="3"/><path d="M520 140 L534 148 L520 156Z" fill="#E59AA8"/><rect x="550" y="120" width="280" height="56" rx="10" fill="#3a2128" stroke="#E59AA8"/><text x="690" y="157" text-anchor="middle" font-family="serif" font-size="24" fill="#F7D6DC">酉（とり）</text><rect x="110" y="192" width="320" height="56" rx="10" fill="#15120d" stroke="rgba(212,178,108,.4)"/><text x="270" y="229" text-anchor="middle" font-family="serif" font-size="24" fill="#EEE7D7">寅・午・戌</text><path d="M450 220 H520" stroke="#E59AA8" stroke-width="3"/><path d="M520 212 L534 220 L520 228Z" fill="#E59AA8"/><rect x="550" y="192" width="280" height="56" rx="10" fill="#3a2128" stroke="#E59AA8"/><text x="690" y="229" text-anchor="middle" font-family="serif" font-size="24" fill="#F7D6DC">卯（う）</text><rect x="110" y="264" width="320" height="56" rx="10" fill="#15120d" stroke="rgba(212,178,108,.4)"/><text x="270" y="301" text-anchor="middle" font-family="serif" font-size="24" fill="#EEE7D7">巳・酉・丑</text><path d="M450 292 H520" stroke="#E59AA8" stroke-width="3"/><path d="M520 284 L534 292 L520 300Z" fill="#E59AA8"/><rect x="550" y="264" width="280" height="56" rx="10" fill="#3a2128" stroke="#E59AA8"/><text x="690" y="301" text-anchor="middle" font-family="serif" font-size="24" fill="#F7D6DC">午（うま）</text><rect x="110" y="336" width="320" height="56" rx="10" fill="#15120d" stroke="rgba(212,178,108,.4)"/><text x="270" y="373" text-anchor="middle" font-family="serif" font-size="24" fill="#EEE7D7">亥・卯・未</text><path d="M450 364 H520" stroke="#E59AA8" stroke-width="3"/><path d="M520 356 L534 364 L520 372Z" fill="#E59AA8"/><rect x="550" y="336" width="280" height="56" rx="10" fill="#3a2128" stroke="#E59AA8"/><text x="690" y="373" text-anchor="middle" font-family="serif" font-size="24" fill="#F7D6DC">子（ね）</text><text x="480" y="440" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#EEE7D7" opacity=".9">年・月・時の柱に、この地支があると「桃花を持っている」と読みます</text>
</svg>
