<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="1月1日のカレンダーの新年、2月4日の立春（サジュの新年）、2月7日の설날（韓国の旧正月）を時間の線に並べた図">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="420" fill="url(#bg)"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#D4B26C"/></marker></defs><text x="480" y="50" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C" letter-spacing="3">2027年は「新しい年」が3回やってくる</text><path d="M80 200 H880" stroke="#D4B26C" stroke-width="3" marker-end="url(#ar)"/><circle cx="160" cy="200" r="12" fill="#EEE7D7"/><text x="160" y="160" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#EEE7D7">1月1日（金）</text><text x="160" y="250" text-anchor="middle" font-family="serif" font-size="20" fill="#EEE7D7">カレンダーの新年</text><text x="160" y="278" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7" opacity=".85">年の変わり目のごあいさつ</text><circle cx="460" cy="200" r="12" fill="#D4B26C"/><text x="460" y="160" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#EEE7D7">2月4日（木）</text><text x="460" y="250" text-anchor="middle" font-family="serif" font-size="20" fill="#D4B26C">立春＝サジュの新年</text><text x="460" y="278" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7" opacity=".85">ここから「丁未」の年</text><circle cx="760" cy="200" r="12" fill="#b0453a"/><text x="760" y="160" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#EEE7D7">2月7日（日）</text><text x="760" y="250" text-anchor="middle" font-family="serif" font-size="20" fill="#b0453a">설날（ソルラル）</text><text x="760" y="278" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7" opacity=".85">韓国の旧正月。連休は2/6〜2/9</text><rect x="120" y="320" width="720" height="70" rx="10" fill="#15120d" stroke="#D4B26C" stroke-opacity=".4"/><text x="480" y="352" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#EEE7D7">12月〜2月は、どの「新年」から数えても来年の話がしやすい時期。</text><text x="480" y="376" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#EEE7D7">だから韓国では、この時期に新年運勢を見る人が多い。</text>
</svg>
