  <circle cx="665" cy="215" r="5" fill="#D4B26C"/><circle cx="630" cy="324" r="5" fill="#D4B26C"/><circle cx="537" cy="391" r="5" fill="#D4B26C"/><circle cx="423" cy="391" r="5" fill="#D4B26C"/><circle cx="330" cy="324" r="5" fill="#D4B26C"/><circle cx="295" cy="215" r="5" fill="#D4B26C"/><circle cx="330" cy="106" r="5" fill="#D4B26C"/><circle cx="423" cy="39" r="5" fill="#D4B26C"/><circle cx="537" cy="39" r="5" fill="#D4B26C"/><circle cx="630" cy="106" r="5" fill="#D4B26C"/>
