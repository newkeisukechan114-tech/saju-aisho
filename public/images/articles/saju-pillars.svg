<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-label="サジュの4本の柱の図。右から年柱・月柱・日柱・時柱が並び、それぞれ上に天干、下に地支がある。日柱の天干が日主">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="460" fill="url(#bg)"/>
  <rect x="150" y="70" width="140" height="300" rx="12" fill="#15120d" stroke="rgba(212,178,108,.35)" stroke-width="1"/><text x="220" y="105" text-anchor="middle" font-family="serif" font-size="20" fill="#D4B26C">時柱</text><text x="220" y="128" text-anchor="middle" font-family="sans-serif" font-size="14" fill="rgba(238,231,215,.7)">生まれた時間</text><text x="220" y="205" text-anchor="middle" font-family="serif" font-size="60" fill="#6178AE">壬</text><text x="220" y="310" text-anchor="middle" font-family="serif" font-size="60" fill="#C9665B">午</text><rect x="320" y="70" width="140" height="300" rx="12" fill="#15120d" stroke="#D4B26C" stroke-width="3"/><text x="390" y="105" text-anchor="middle" font-family="serif" font-size="20" fill="#D4B26C">日柱</text><text x="390" y="128" text-anchor="middle" font-family="sans-serif" font-size="14" fill="rgba(238,231,215,.7)">生まれた日</text><text x="390" y="205" text-anchor="middle" font-family="serif" font-size="60" fill="#5E9C80">乙</text><text x="390" y="310" text-anchor="middle" font-family="serif" font-size="60" fill="#D3A64A">未</text><rect x="490" y="70" width="140" height="300" rx="12" fill="#15120d" stroke="rgba(212,178,108,.35)" stroke-width="1"/><text x="560" y="105" text-anchor="middle" font-family="serif" font-size="20" fill="#D4B26C">月柱</text><text x="560" y="128" text-anchor="middle" font-family="sans-serif" font-size="14" fill="rgba(238,231,215,.7)">生まれた月</text><text x="560" y="205" text-anchor="middle" font-family="serif" font-size="60" fill="#C9665B">丁</text><text x="560" y="310" text-anchor="middle" font-family="serif" font-size="60" fill="#C9665B">巳</text><rect x="660" y="70" width="140" height="300" rx="12" fill="#15120d" stroke="rgba(212,178,108,.35)" stroke-width="1"/><text x="730" y="105" text-anchor="middle" font-family="serif" font-size="20" fill="#D4B26C">年柱</text><text x="730" y="128" text-anchor="middle" font-family="sans-serif" font-size="14" fill="rgba(238,231,215,.7)">生まれた年</text><text x="730" y="205" text-anchor="middle" font-family="serif" font-size="60" fill="#6178AE">癸</text><text x="730" y="310" text-anchor="middle" font-family="serif" font-size="60" fill="#DCD8CC">酉</text><text x="95" y="205" text-anchor="middle" font-family="serif" font-size="18" fill="#D4B26C">天干</text><text x="95" y="310" text-anchor="middle" font-family="serif" font-size="18" fill="#D4B26C">地支</text><path d="M390 400 L390 380" stroke="#D4B26C" stroke-width="2"/><text x="390" y="425" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#D4B26C">日主（あなた自身）</text><text x="830" y="205" text-anchor="middle" font-family="sans-serif" font-size="15" fill="rgba(238,231,215,.7)">上の段</text><text x="830" y="310" text-anchor="middle" font-family="sans-serif" font-size="15" fill="rgba(238,231,215,.7)">下の段</text><text x="480" y="40" text-anchor="middle" font-family="serif" font-size="20" fill="#D4B26C">4本の柱 × 2文字 ＝ 8文字（例）</text>
</svg>
