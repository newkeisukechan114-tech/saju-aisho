<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-label="MBTIとサジュの違いの比較表。もとにするもの、分類、変わるか、得意なこと、位置づけを並べている">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="470" fill="url(#bg)"/>
  <text x="480" y="48" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C" letter-spacing="3">MBTIとサジュの違い</text>
  <text x="400" y="88" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#EEE7D7">MBTI</text>
  <text x="730" y="88" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#D4B26C">サジュ</text><rect x="40" y="104" width="880" height="54" rx="6" fill="#15120d"/>
  <text x="60" y="137" font-family="sans-serif" font-size="15" fill="#D4B26C">もとにするもの</text>
  <text x="400" y="137" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#EEE7D7">質問への自分の答え</text>
  <text x="730" y="137" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#EEE7D7">生まれた年・月・日・時間</text><rect x="40" y="166" width="880" height="54" rx="6" fill="rgba(238,231,215,.04)"/>
  <text x="60" y="199" font-family="sans-serif" font-size="15" fill="#D4B26C">分類</text>
  <text x="400" y="199" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#EEE7D7">16タイプ</text>
  <text x="730" y="199" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#EEE7D7">日主10タイプ×8文字の組み合わせ</text><rect x="40" y="228" width="880" height="54" rx="6" fill="#15120d"/>
  <text x="60" y="261" font-family="sans-serif" font-size="15" fill="#D4B26C">変わるか</text>
  <text x="400" y="261" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#EEE7D7">答え方や時期で変わることがある</text>
  <text x="730" y="261" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#EEE7D7">命式は一生同じ。運の流れは変わる</text><rect x="40" y="290" width="880" height="54" rx="6" fill="rgba(238,231,215,.04)"/>
  <text x="60" y="323" font-family="sans-serif" font-size="15" fill="#D4B26C">得意なこと</text>
  <text x="400" y="323" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#EEE7D7">考え方・感じ方のくせ</text>
  <text x="730" y="323" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#EEE7D7">気質、相性、時期（タイミング）</text><rect x="40" y="352" width="880" height="54" rx="6" fill="#15120d"/>
  <text x="60" y="385" font-family="sans-serif" font-size="15" fill="#D4B26C">位置づけ</text>
  <text x="400" y="385" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#EEE7D7">心理学をもとにした性格検査</text>
  <text x="730" y="385" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#EEE7D7">東洋の占い（命術）</text><text x="480.0" y="458" text-anchor="middle" font-family="serif" font-size="21" fill="#D4B26C" letter-spacing="5">得意なことが違う、ふたつのものさし</text>
</svg>
