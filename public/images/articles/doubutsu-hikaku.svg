<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-label="サジュと動物占いの違いの比較表。生まれ、使う情報、分け方、表し方、得意なことを並べている">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="470" fill="url(#bg)"/>
  <text x="480" y="48" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C" letter-spacing="3">サジュと動物占いの違い</text>
  <text x="400" y="88" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#D4B26C">サジュ</text>
  <text x="730" y="88" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#EEE7D7">動物占い</text><rect x="30" y="104" width="900" height="54" rx="6" fill="#15120d"/>
  <text x="48" y="137" font-family="sans-serif" font-size="15" fill="#D4B26C">生まれ</text>
  <text x="400" y="137" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7">中国の四柱八字が、韓国に伝わった</text>
  <text x="730" y="137" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7">1990年代の日本。四柱推命に心理学を加えた</text><rect x="30" y="166" width="900" height="54" rx="6" fill="rgba(238,231,215,.04)"/>
  <text x="48" y="199" font-family="sans-serif" font-size="15" fill="#D4B26C">使う情報</text>
  <text x="400" y="199" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7">生まれた年・月・日・時間</text>
  <text x="730" y="199" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7">生まれた年・月・日</text><rect x="30" y="228" width="900" height="54" rx="6" fill="#15120d"/>
  <text x="48" y="261" font-family="sans-serif" font-size="15" fill="#D4B26C">分け方</text>
  <text x="400" y="261" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7">日主10タイプ×8文字、五行</text>
  <text x="730" y="261" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7">12の動物、60のキャラ、3つのグループ</text><rect x="30" y="290" width="900" height="54" rx="6" fill="rgba(238,231,215,.04)"/>
  <text x="48" y="323" font-family="sans-serif" font-size="15" fill="#D4B26C">表し方</text>
  <text x="400" y="323" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7">木・火・土・金・水の自然のたとえ</text>
  <text x="730" y="323" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7">身近な動物のキャラクター</text><rect x="30" y="352" width="900" height="54" rx="6" fill="#15120d"/>
  <text x="48" y="385" font-family="sans-serif" font-size="15" fill="#D4B26C">得意なこと</text>
  <text x="400" y="385" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7">気質、相性、10年・1年の運の流れ</text>
  <text x="730" y="385" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7">人間関係のタイプ、付き合い方</text><text x="480.0" y="458" text-anchor="middle" font-family="serif" font-size="21" fill="#D4B26C" letter-spacing="5">同じ根でも、得意なことが違う</text>
</svg>
