<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-label="日主10タイプ別の、子どものこころに届く言葉の一覧">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="620" fill="url(#bg)"/>
  <text x="480" y="50" text-anchor="middle" font-family="serif" font-size="24" fill="#D4B26C" letter-spacing="4">子どもの日主別・こころに届く言葉</text><rect x="40" y="80" width="430" height="92" rx="10" fill="#15120d" stroke="rgba(212,178,108,.35)"/><circle cx="86" cy="126" r="30" fill="none" stroke="#5E9C80" stroke-width="3"/><text x="86" y="137" text-anchor="middle" font-family="serif" font-size="30" fill="#5E9C80">甲</text><text x="132" y="102" font-family="sans-serif" font-size="13" fill="#D4B26C">大樹タイプ</text><text x="148" y="136" font-family="sans-serif" font-size="18" fill="#EEE7D7">「最後までやりきったね」</text><rect x="490" y="80" width="430" height="92" rx="10" fill="#15120d" stroke="rgba(212,178,108,.35)"/><circle cx="536" cy="126" r="30" fill="none" stroke="#5E9C80" stroke-width="3"/><text x="536" y="137" text-anchor="middle" font-family="serif" font-size="30" fill="#5E9C80">乙</text><text x="582" y="102" font-family="sans-serif" font-size="13" fill="#D4B26C">草花タイプ</text><text x="598" y="136" font-family="sans-serif" font-size="18" fill="#EEE7D7">「○○ちゃんはどうしたい？」</text><rect x="40" y="184" width="430" height="92" rx="10" fill="#15120d" stroke="rgba(212,178,108,.35)"/><circle cx="86" cy="230" r="30" fill="none" stroke="#C9665B" stroke-width="3"/><text x="86" y="241" text-anchor="middle" font-family="serif" font-size="30" fill="#C9665B">丙</text><text x="132" y="206" font-family="sans-serif" font-size="13" fill="#D4B26C">太陽タイプ</text><text x="148" y="240" font-family="sans-serif" font-size="18" fill="#EEE7D7">「見てたよ！」</text><rect x="490" y="184" width="430" height="92" rx="10" fill="#15120d" stroke="rgba(212,178,108,.35)"/><circle cx="536" cy="230" r="30" fill="none" stroke="#C9665B" stroke-width="3"/><text x="536" y="241" text-anchor="middle" font-family="serif" font-size="30" fill="#C9665B">丁</text><text x="582" y="206" font-family="sans-serif" font-size="13" fill="#D4B26C">灯火タイプ</text><text x="598" y="240" font-family="sans-serif" font-size="18" fill="#EEE7D7">「よく気がついたね」</text><rect x="40" y="288" width="430" height="92" rx="10" fill="#15120d" stroke="rgba(212,178,108,.35)"/><circle cx="86" cy="334" r="30" fill="none" stroke="#D3A64A" stroke-width="3"/><text x="86" y="345" text-anchor="middle" font-family="serif" font-size="30" fill="#D3A64A">戊</text><text x="132" y="310" font-family="sans-serif" font-size="13" fill="#D4B26C">山タイプ</text><text x="148" y="344" font-family="sans-serif" font-size="18" fill="#EEE7D7">「ゆっくりでいいよ」</text><rect x="490" y="288" width="430" height="92" rx="10" fill="#15120d" stroke="rgba(212,178,108,.35)"/><circle cx="536" cy="334" r="30" fill="none" stroke="#D3A64A" stroke-width="3"/><text x="536" y="345" text-anchor="middle" font-family="serif" font-size="30" fill="#D3A64A">己</text><text x="582" y="310" font-family="sans-serif" font-size="13" fill="#D4B26C">田畑タイプ</text><text x="598" y="344" font-family="sans-serif" font-size="18" fill="#EEE7D7">「助かったよ、ありがとう」</text><rect x="40" y="392" width="430" height="92" rx="10" fill="#15120d" stroke="rgba(212,178,108,.35)"/><circle cx="86" cy="438" r="30" fill="none" stroke="#DCD8CC" stroke-width="3"/><text x="86" y="449" text-anchor="middle" font-family="serif" font-size="30" fill="#DCD8CC">庚</text><text x="132" y="414" font-family="sans-serif" font-size="13" fill="#D4B26C">鋼タイプ</text><text x="148" y="448" font-family="sans-serif" font-size="18" fill="#EEE7D7">「約束を守れたね」</text><rect x="490" y="392" width="430" height="92" rx="10" fill="#15120d" stroke="rgba(212,178,108,.35)"/><circle cx="536" cy="438" r="30" fill="none" stroke="#DCD8CC" stroke-width="3"/><text x="536" y="449" text-anchor="middle" font-family="serif" font-size="30" fill="#DCD8CC">辛</text><text x="582" y="414" font-family="sans-serif" font-size="13" fill="#D4B26C">宝石タイプ</text><text x="598" y="448" font-family="sans-serif" font-size="18" fill="#EEE7D7">「その色、すてきだね」</text><rect x="40" y="496" width="430" height="92" rx="10" fill="#15120d" stroke="rgba(212,178,108,.35)"/><circle cx="86" cy="542" r="30" fill="none" stroke="#6178AE" stroke-width="3"/><text x="86" y="553" text-anchor="middle" font-family="serif" font-size="30" fill="#6178AE">壬</text><text x="132" y="518" font-family="sans-serif" font-size="13" fill="#D4B26C">大海タイプ</text><text x="148" y="552" font-family="sans-serif" font-size="18" fill="#EEE7D7">「一緒に調べてみよう」</text><rect x="490" y="496" width="430" height="92" rx="10" fill="#15120d" stroke="rgba(212,178,108,.35)"/><circle cx="536" cy="542" r="30" fill="none" stroke="#6178AE" stroke-width="3"/><text x="536" y="553" text-anchor="middle" font-family="serif" font-size="30" fill="#6178AE">癸</text><text x="582" y="518" font-family="sans-serif" font-size="13" fill="#D4B26C">雨露タイプ</text><text x="598" y="552" font-family="sans-serif" font-size="18" fill="#EEE7D7">「どう思った？教えてくれる？」</text>
</svg>
