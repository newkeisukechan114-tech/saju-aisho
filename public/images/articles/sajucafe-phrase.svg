<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-label="サジュカフェで使える韓国語フレーズ6つを、ハングル・読み方・日本語訳で並べたカード">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="460" fill="url(#bg)"/>
  <text x="480" y="46" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C" letter-spacing="3">そのまま使える韓国語フレーズ</text><rect x="60" y="80" width="410" height="104" rx="12" fill="#15120d" stroke="#D4B26C" stroke-opacity=".5"/><text x="82" y="118" font-family="sans-serif" font-size="22" fill="#EEE7D7">사주 보고 싶어요</text><text x="82" y="146" font-family="sans-serif" font-size="14" fill="#D4B26C">サジュ ポゴ シポヨ</text><text x="82" y="170" font-family="sans-serif" font-size="14" fill="#EEE7D7" opacity=".8">サジュを見てもらいたいです</text><rect x="490" y="80" width="410" height="104" rx="12" fill="#15120d" stroke="#D4B26C" stroke-opacity=".5"/><text x="512" y="118" font-family="sans-serif" font-size="22" fill="#EEE7D7">일본어 가능해요?</text><text x="512" y="146" font-family="sans-serif" font-size="14" fill="#D4B26C">イルボノ カヌンヘヨ？</text><text x="512" y="170" font-family="sans-serif" font-size="14" fill="#EEE7D7" opacity=".8">日本語はできますか？</text><rect x="60" y="200" width="410" height="104" rx="12" fill="#15120d" stroke="#D4B26C" stroke-opacity=".5"/><text x="82" y="238" font-family="sans-serif" font-size="22" fill="#EEE7D7">양력이에요</text><text x="82" y="266" font-family="sans-serif" font-size="14" fill="#D4B26C">ヤンニョギエヨ</text><text x="82" y="290" font-family="sans-serif" font-size="14" fill="#EEE7D7" opacity=".8">（誕生日は）陽暦です</text><rect x="490" y="200" width="410" height="104" rx="12" fill="#15120d" stroke="#D4B26C" stroke-opacity=".5"/><text x="512" y="238" font-family="sans-serif" font-size="22" fill="#EEE7D7">태어난 시간은 몰라요</text><text x="512" y="266" font-family="sans-serif" font-size="14" fill="#D4B26C">テオナン シガヌン モルラヨ</text><text x="512" y="290" font-family="sans-serif" font-size="14" fill="#EEE7D7" opacity=".8">生まれた時間はわかりません</text><rect x="60" y="320" width="410" height="104" rx="12" fill="#15120d" stroke="#D4B26C" stroke-opacity=".5"/><text x="82" y="358" font-family="sans-serif" font-size="22" fill="#EEE7D7">연애운 봐 주세요</text><text x="82" y="386" font-family="sans-serif" font-size="14" fill="#D4B26C">ヨネウン ポァ ジュセヨ</text><text x="82" y="410" font-family="sans-serif" font-size="14" fill="#EEE7D7" opacity=".8">恋愛運を見てください</text><rect x="490" y="320" width="410" height="104" rx="12" fill="#15120d" stroke="#D4B26C" stroke-opacity=".5"/><text x="512" y="358" font-family="sans-serif" font-size="22" fill="#EEE7D7">궁합 봐 주세요</text><text x="512" y="386" font-family="sans-serif" font-size="14" fill="#D4B26C">クンハプ ポァ ジュセヨ</text><text x="512" y="410" font-family="sans-serif" font-size="14" fill="#EEE7D7" opacity=".8">相性を見てください</text>
</svg>
