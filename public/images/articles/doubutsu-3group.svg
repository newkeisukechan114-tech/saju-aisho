<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="動物占いのMOON・EARTH・SUNの3グループと、それぞれに重なりやすい日主を並べた図">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="420" fill="url(#bg)"/>
  <text x="480" y="48" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C" letter-spacing="3">動物占いの3グループと、重なりやすい日主（目安）</text><rect x="40" y="80" width="280" height="290" rx="12" fill="#15120d" stroke="#a9b4c8" stroke-width="2"/>
  <text x="180" y="120" text-anchor="middle" font-family="serif" font-size="26" fill="#a9b4c8" letter-spacing="3">MOON</text>
  <text x="180" y="148" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#EEE7D7">「いい人」チーム</text>
  <text x="180" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#EEE7D7" opacity=".8">愛情・信頼・相手に合わせる</text><circle cx="87" cy="270" r="26" fill="none" stroke="#5E9C80" stroke-width="3"/><text x="87" y="280" text-anchor="middle" font-family="serif" font-size="26" fill="#5E9C80">乙</text><circle cx="149" cy="270" r="26" fill="none" stroke="#C9665B" stroke-width="3"/><text x="149" y="280" text-anchor="middle" font-family="serif" font-size="26" fill="#C9665B">丁</text><circle cx="211" cy="270" r="26" fill="none" stroke="#D3A64A" stroke-width="3"/><text x="211" y="280" text-anchor="middle" font-family="serif" font-size="26" fill="#D3A64A">己</text><circle cx="273" cy="270" r="26" fill="none" stroke="#6178AE" stroke-width="3"/><text x="273" y="280" text-anchor="middle" font-family="serif" font-size="26" fill="#6178AE">癸</text><rect x="340" y="80" width="280" height="290" rx="12" fill="#15120d" stroke="#D3A64A" stroke-width="2"/>
  <text x="480" y="120" text-anchor="middle" font-family="serif" font-size="26" fill="#D3A64A" letter-spacing="3">EARTH</text>
  <text x="480" y="148" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#EEE7D7">「しっかり者」チーム</text>
  <text x="480" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#EEE7D7" opacity=".8">現実的・結果・夢の実現</text><circle cx="418" cy="270" r="26" fill="none" stroke="#5E9C80" stroke-width="3"/><text x="418" y="280" text-anchor="middle" font-family="serif" font-size="26" fill="#5E9C80">甲</text><circle cx="480" cy="270" r="26" fill="none" stroke="#D3A64A" stroke-width="3"/><text x="480" y="280" text-anchor="middle" font-family="serif" font-size="26" fill="#D3A64A">戊</text><circle cx="542" cy="270" r="26" fill="none" stroke="#DCD8CC" stroke-width="3"/><text x="542" y="280" text-anchor="middle" font-family="serif" font-size="26" fill="#DCD8CC">庚</text><rect x="640" y="80" width="280" height="290" rx="12" fill="#15120d" stroke="#C9665B" stroke-width="2"/>
  <text x="780" y="120" text-anchor="middle" font-family="serif" font-size="26" fill="#C9665B" letter-spacing="3">SUN</text>
  <text x="780" y="148" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#EEE7D7">「天才」チーム</text>
  <text x="780" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#EEE7D7" opacity=".8">中心で輝く・自由・可能性</text><circle cx="718" cy="270" r="26" fill="none" stroke="#C9665B" stroke-width="3"/><text x="718" y="280" text-anchor="middle" font-family="serif" font-size="26" fill="#C9665B">丙</text><circle cx="780" cy="270" r="26" fill="none" stroke="#DCD8CC" stroke-width="3"/><text x="780" y="280" text-anchor="middle" font-family="serif" font-size="26" fill="#DCD8CC">辛</text><circle cx="842" cy="270" r="26" fill="none" stroke="#6178AE" stroke-width="3"/><text x="842" y="280" text-anchor="middle" font-family="serif" font-size="26" fill="#6178AE">壬</text><text x="480.0" y="405" text-anchor="middle" font-family="serif" font-size="21" fill="#D4B26C" letter-spacing="5">グループの価値観と、日主の気質を重ねてみる</text>
</svg>
