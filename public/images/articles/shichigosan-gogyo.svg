<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="親と子の五行の関係を4つの型で表した図。親が子を育てる、子が親を育てる、同じ五行、おさえ合う">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="440" fill="url(#bg)"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#D4B26C"/></marker></defs><rect x="30" y="70" width="210" height="300" rx="12" fill="#15120d" stroke="rgba(212,178,108,.35)"/>
  <text x="135" y="110" text-anchor="middle" font-family="serif" font-size="19" fill="#D4B26C">親が子を育てる</text>
  <circle cx="85" cy="200" r="36" fill="none" stroke="#9aa6c4" stroke-width="3"/><text x="85" y="207" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#EEE7D7">親</text>
  <circle cx="205" cy="200" r="26" fill="none" stroke="#e9a6b8" stroke-width="3"/><text x="205" y="207" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#EEE7D7">子</text>
  <path d="M122 200 H178" stroke="#D4B26C" stroke-width="3" marker-end="url(#ar)"/>
  <text x="135" y="300" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#EEE7D7">世話を焼いて伸ばす</text><text x="135" y="328" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#EEE7D7">任せる場面も</text><rect x="260" y="70" width="210" height="300" rx="12" fill="#15120d" stroke="rgba(212,178,108,.35)"/>
  <text x="365" y="110" text-anchor="middle" font-family="serif" font-size="19" fill="#D4B26C">子が親を育てる</text>
  <circle cx="315" cy="200" r="36" fill="none" stroke="#9aa6c4" stroke-width="3"/><text x="315" y="207" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#EEE7D7">親</text>
  <circle cx="435" cy="200" r="26" fill="none" stroke="#e9a6b8" stroke-width="3"/><text x="435" y="207" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#EEE7D7">子</text>
  <path d="M408 200 H352" stroke="#D4B26C" stroke-width="3" marker-end="url(#ar)"/>
  <text x="365" y="300" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#EEE7D7">子から元気をもらう</text><text x="365" y="328" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#EEE7D7">頼りすぎない</text><rect x="490" y="70" width="210" height="300" rx="12" fill="#15120d" stroke="rgba(212,178,108,.35)"/>
  <text x="595" y="110" text-anchor="middle" font-family="serif" font-size="19" fill="#D4B26C">同じ五行</text>
  <circle cx="545" cy="200" r="36" fill="none" stroke="#9aa6c4" stroke-width="3"/><text x="545" y="207" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#EEE7D7">親</text>
  <circle cx="665" cy="200" r="26" fill="none" stroke="#e9a6b8" stroke-width="3"/><text x="665" y="207" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#EEE7D7">子</text>
  <path d="M586 194 H634 M586 206 H634" stroke="#D4B26C" stroke-width="3"/>
  <text x="595" y="300" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#EEE7D7">わかり合いやすい</text><text x="595" y="328" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#EEE7D7">ぶつかると平行線</text><rect x="720" y="70" width="210" height="300" rx="12" fill="#15120d" stroke="rgba(212,178,108,.35)"/>
  <text x="825" y="110" text-anchor="middle" font-family="serif" font-size="19" fill="#D4B26C">おさえ合う</text>
  <circle cx="775" cy="200" r="36" fill="none" stroke="#9aa6c4" stroke-width="3"/><text x="775" y="207" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#EEE7D7">親</text>
  <circle cx="895" cy="200" r="26" fill="none" stroke="#e9a6b8" stroke-width="3"/><text x="895" y="207" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#EEE7D7">子</text>
  <path d="M820 188 L860 212 M860 188 L820 212" stroke="#8a7aa8" stroke-width="3"/>
  <text x="825" y="300" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#EEE7D7">違いから学び合う</text><text x="825" y="328" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#EEE7D7">まず子に聞く</text><text x="480.0" y="418" text-anchor="middle" font-family="serif" font-size="21" fill="#D4B26C" letter-spacing="5">親と子の五行の関係</text>
</svg>
