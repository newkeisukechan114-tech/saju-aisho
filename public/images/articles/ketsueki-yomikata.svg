<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-label="外側の円にA型のふるまい、内側の円に庚金の芯を描き、組み合わせると「約束は必ず守る、筋の通った人」になることを示した図">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="430" fill="url(#bg)"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#D4B26C"/></marker></defs><text x="480" y="46" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C" letter-spacing="3">掛け合わせの読み方（例：庚金×A型）</text><circle cx="300" cy="230" r="150" fill="#9c4a52" opacity=".18" stroke="#d98c96"/><circle cx="300" cy="230" r="78" fill="#15120d" stroke="#D4B26C" stroke-width="2"/><text x="300" y="222" text-anchor="middle" font-family="serif" font-size="30" fill="#D4B26C">庚</text><text x="300" y="252" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7">鋼の芯</text><text x="300" y="118" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#d98c96">A型の外側</text><path d="M470 150 H560" stroke="#D4B26C" marker-end="url(#ar)"/><path d="M470 300 H560" stroke="#D4B26C" marker-end="url(#ar)"/><text x="580" y="140" font-family="sans-serif" font-size="15" fill="#d98c96">外から見える：きちんとしていて、気配りができる</text><text x="580" y="166" font-family="sans-serif" font-size="15" fill="#d98c96">（A型らしいふるまい）</text><text x="580" y="292" font-family="sans-serif" font-size="15" fill="#D4B26C">内にある芯：決めたことは曲げない</text><text x="580" y="318" font-family="sans-serif" font-size="15" fill="#D4B26C">（庚金らしい性質）</text><rect x="560" y="352" width="360" height="56" rx="8" fill="#15120d" stroke="#D4B26C" stroke-opacity=".4"/><text x="740" y="386" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#EEE7D7">→「約束は必ず守る、筋の通った人」</text>
</svg>
