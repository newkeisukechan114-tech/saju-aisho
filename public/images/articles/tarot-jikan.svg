<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="時間の長さを横軸にした図。タロットはいまから数か月、サジュは月・年・10年から一生までを読む">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="400" fill="url(#bg)"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#D4B26C"/></marker></defs><text x="480" y="46" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C" letter-spacing="3">読める「時間の長さ」がちがう</text><path d="M120 300 H880" stroke="#EEE7D7" stroke-width="2" marker-end="url(#ar)"/><path d="M150 294 V306" stroke="#EEE7D7" stroke-width="2"/><text x="150" y="330" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#EEE7D7">いま</text><path d="M300 294 V306" stroke="#EEE7D7" stroke-width="2"/><text x="300" y="330" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#EEE7D7">数週間</text><path d="M450 294 V306" stroke="#EEE7D7" stroke-width="2"/><text x="450" y="330" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#EEE7D7">数か月</text><path d="M600 294 V306" stroke="#EEE7D7" stroke-width="2"/><text x="600" y="330" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#EEE7D7">1年</text><path d="M740 294 V306" stroke="#EEE7D7" stroke-width="2"/><text x="740" y="330" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#EEE7D7">10年</text><path d="M860 294 V306" stroke="#EEE7D7" stroke-width="2"/><text x="860" y="330" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#EEE7D7">一生</text><rect x="140" y="130" width="330" height="44" rx="22" fill="#8a6fb0" opacity=".55"/><text x="305" y="159" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#EEE7D7">タロット：いまの気持ち・近い流れ</text><rect x="140" y="200" width="730" height="44" rx="22" fill="#D4B26C" opacity=".35"/><text x="505" y="229" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#EEE7D7">サジュ：生まれ持った気質と、月・年・10年の運の流れ</text><text x="480" y="380" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7" opacity=".8">※読み方や占い師によって、見る範囲は変わります</text>
</svg>
