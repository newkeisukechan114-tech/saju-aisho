<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="子の刻の区切りの違いを示す図。日本の四柱推命では23時から1時、韓国のサジュでは30分ずらして23時30分から1時30分と見ることが多い">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="400" fill="url(#bg)"/>
  <text x="480" y="50" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C" letter-spacing="3">時間の区切りが、30分ずれることがある</text><path d="M150 120 V330" stroke="rgba(238,231,215,.15)"/><text x="150" y="110" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#D4B26C">21:00</text><path d="M270 120 V330" stroke="rgba(238,231,215,.15)"/><text x="270" y="110" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#D4B26C">22:00</text><path d="M390 120 V330" stroke="rgba(238,231,215,.15)"/><text x="390" y="110" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#D4B26C">23:00</text><path d="M510 120 V330" stroke="rgba(238,231,215,.15)"/><text x="510" y="110" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#D4B26C">0:00</text><path d="M630 120 V330" stroke="rgba(238,231,215,.15)"/><text x="630" y="110" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#D4B26C">1:00</text><path d="M750 120 V330" stroke="rgba(238,231,215,.15)"/><text x="750" y="110" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#D4B26C">2:00</text><path d="M870 120 V330" stroke="rgba(238,231,215,.15)"/><text x="870" y="110" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#D4B26C">3:00</text><text x="60" y="184" font-family="sans-serif" font-size="17" fill="#EEE7D7">日本</text>
  <rect x="390" y="160" width="240" height="36" rx="6" fill="#D3A64A" opacity=".85"/>
  <text x="510" y="184" text-anchor="middle" font-family="serif" font-size="18" fill="#15120d">子の刻</text>
  <text x="644" y="184" font-family="sans-serif" font-size="14" fill="#EEE7D7" opacity=".85">23:00〜1:00</text><text x="60" y="264" font-family="sans-serif" font-size="17" fill="#EEE7D7">韓国</text>
  <rect x="450" y="240" width="240" height="36" rx="6" fill="#6178AE" opacity=".85"/>
  <text x="570" y="264" text-anchor="middle" font-family="serif" font-size="18" fill="#15120d">子の刻</text>
  <text x="704" y="264" font-family="sans-serif" font-size="14" fill="#EEE7D7" opacity=".85">23:30〜1:30</text><text x="60" y="370" font-family="sans-serif" font-size="14" fill="#EEE7D7" opacity=".8">韓国は、時計の基準（東経135度）と実際の位置（約127度）の差を、約30分の補正で調整する考え方がある</text>
</svg>
