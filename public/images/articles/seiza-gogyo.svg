<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="西洋占星術の火・地・風・水の4元素と、サジュの木・火・土・金・水の五行を並べた図。火と火、地と土、水と水が近い">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="420" fill="url(#bg)"/>
  <text x="480" y="48" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C" letter-spacing="3">西洋の「4元素」と、サジュの「五行」</text><circle cx="110" cy="112" r="24" fill="none" stroke="#C9665B" stroke-width="3"/><text x="110" y="121" text-anchor="middle" font-family="serif" font-size="24" fill="#C9665B">火</text><text x="150" y="118" font-family="sans-serif" font-size="15" fill="#EEE7D7">牡羊・獅子・射手</text><circle cx="110" cy="182" r="24" fill="none" stroke="#D3A64A" stroke-width="3"/><text x="110" y="191" text-anchor="middle" font-family="serif" font-size="24" fill="#D3A64A">地</text><text x="150" y="188" font-family="sans-serif" font-size="15" fill="#EEE7D7">牡牛・乙女・山羊</text><circle cx="110" cy="252" r="24" fill="none" stroke="#a9b4c8" stroke-width="3"/><text x="110" y="261" text-anchor="middle" font-family="serif" font-size="24" fill="#a9b4c8">風</text><text x="150" y="258" font-family="sans-serif" font-size="15" fill="#EEE7D7">双子・天秤・水瓶</text><circle cx="110" cy="322" r="24" fill="none" stroke="#6178AE" stroke-width="3"/><text x="110" y="331" text-anchor="middle" font-family="serif" font-size="24" fill="#6178AE">水</text><text x="150" y="328" font-family="sans-serif" font-size="15" fill="#EEE7D7">蟹・蠍・魚</text><circle cx="640" cy="110" r="22" fill="none" stroke="#5E9C80" stroke-width="3"/><text x="640" y="119" text-anchor="middle" font-family="serif" font-size="22" fill="#5E9C80">木</text><circle cx="640" cy="166" r="22" fill="none" stroke="#C9665B" stroke-width="3"/><text x="640" y="175" text-anchor="middle" font-family="serif" font-size="22" fill="#C9665B">火</text><circle cx="640" cy="222" r="22" fill="none" stroke="#D3A64A" stroke-width="3"/><text x="640" y="231" text-anchor="middle" font-family="serif" font-size="22" fill="#D3A64A">土</text><circle cx="640" cy="278" r="22" fill="none" stroke="#DCD8CC" stroke-width="3"/><text x="640" y="287" text-anchor="middle" font-family="serif" font-size="22" fill="#DCD8CC">金</text><circle cx="640" cy="334" r="22" fill="none" stroke="#6178AE" stroke-width="3"/><text x="640" y="343" text-anchor="middle" font-family="serif" font-size="22" fill="#6178AE">水</text><path d="M350 112 L612 166" stroke="#D4B26C" stroke-width="1.5" stroke-dasharray="4 5" opacity=".7"/><path d="M350 182 L612 222" stroke="#D4B26C" stroke-width="1.5" stroke-dasharray="4 5" opacity=".7"/><path d="M350 322 L612 334" stroke="#D4B26C" stroke-width="1.5" stroke-dasharray="4 5" opacity=".7"/><text x="700" y="120" font-family="sans-serif" font-size="14" fill="#EEE7D7" opacity=".85">風・木・金には、</text><text x="700" y="142" font-family="sans-serif" font-size="14" fill="#EEE7D7" opacity=".85">ぴったり重なるものがない</text>
  <text x="480" y="396" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7" opacity=".85">点線は、性質が近いもの（目安）</text><text x="480.0" y="412" text-anchor="middle" font-family="serif" font-size="21" fill="#D4B26C" letter-spacing="5"></text>
</svg>
