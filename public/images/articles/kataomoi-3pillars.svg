<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="生まれた時間がわからなくても、年柱・月柱・日柱の3本の柱で、日主と日支を含む相性の大部分が見られることを表した図">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="400" fill="url(#bg)"/>
  <text x="480" y="50" text-anchor="middle" font-family="serif" font-size="20" fill="#D4B26C">相性に大切な「日主」と「日支」は、生まれた日でわかる</text><rect x="180" y="80" width="130" height="220" rx="12" fill="#15120d" stroke="rgba(238,231,215,.25)" stroke-dasharray="6 6"/><text x="245" y="115" text-anchor="middle" font-family="serif" font-size="20" fill="rgba(238,231,215,.25)">時柱</text><text x="245" y="200" text-anchor="middle" font-family="serif" font-size="40" fill="rgba(238,231,215,.25)">？</text><rect x="340" y="80" width="130" height="220" rx="12" fill="#15120d" stroke="#D4B26C" stroke-dasharray=""/><text x="405" y="115" text-anchor="middle" font-family="serif" font-size="20" fill="#D4B26C">日柱</text><text x="405" y="200" text-anchor="middle" font-family="serif" font-size="30" fill="#D4B26C">日主</text><text x="405" y="250" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C">日支</text><rect x="500" y="80" width="130" height="220" rx="12" fill="#15120d" stroke="#D4B26C" stroke-dasharray=""/><text x="565" y="115" text-anchor="middle" font-family="serif" font-size="20" fill="#D4B26C">月柱</text><text x="565" y="200" text-anchor="middle" font-family="serif" font-size="30" fill="#D4B26C">●</text><rect x="660" y="80" width="130" height="220" rx="12" fill="#15120d" stroke="#D4B26C" stroke-dasharray=""/><text x="725" y="115" text-anchor="middle" font-family="serif" font-size="20" fill="#D4B26C">年柱</text><text x="725" y="200" text-anchor="middle" font-family="serif" font-size="30" fill="#D4B26C">●</text><text x="245" y="330" text-anchor="middle" font-family="sans-serif" font-size="16" fill="rgba(238,231,215,.7)">時間がわからなくてもOK</text><text x="580" y="330" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#D4B26C">生年月日だけで出せる</text><text x="480.0" y="380" text-anchor="middle" font-family="serif" font-size="21" fill="#D4B26C" letter-spacing="5">生年月日だけで、相性の大部分が見られる</text>
</svg>
