<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-label="日柱の干支と運命星、空亡の対応表。甲子から癸酉は土星人で空亡は戌亥、甲戌から癸未は金星人で申酉、甲申から癸巳は火星人で午未、甲午から癸卯は天王星人で辰巳、甲辰から癸丑は木星人で寅卯、甲寅から癸亥は水星人で子丑">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="480" fill="url(#bg)"/>
  <text x="480" y="46" text-anchor="middle" font-family="serif" font-size="23" fill="#D4B26C" letter-spacing="3">日柱の干支でわかる、星人と空亡（くうぼう）</text><text x="220" y="92" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#D4B26C">日柱の干支</text><text x="500" y="92" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#D4B26C">運命星</text><text x="760" y="92" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#D4B26C">空亡になる地支</text><rect x="80" y="108" width="800" height="46" rx="8" fill="#15120d" stroke="rgba(212,178,108,.3)"/><text x="220" y="139" text-anchor="middle" font-family="serif" font-size="21" fill="#EEE7D7">甲子 〜 癸酉</text><circle cx="430" cy="131" r="11" fill="#C9A66B"/><text x="510" y="139" text-anchor="middle" font-family="serif" font-size="21" fill="#EEE7D7">土星人</text><text x="760" y="139" text-anchor="middle" font-family="serif" font-size="21" fill="#F7D6DC">戌・亥</text><rect x="80" y="164" width="800" height="46" rx="8" fill="#15120d" stroke="rgba(212,178,108,.3)"/><text x="220" y="195" text-anchor="middle" font-family="serif" font-size="21" fill="#EEE7D7">甲戌 〜 癸未</text><circle cx="430" cy="187" r="11" fill="#E8D9A8"/><text x="510" y="195" text-anchor="middle" font-family="serif" font-size="21" fill="#EEE7D7">金星人</text><text x="760" y="195" text-anchor="middle" font-family="serif" font-size="21" fill="#F7D6DC">申・酉</text><rect x="80" y="220" width="800" height="46" rx="8" fill="#15120d" stroke="rgba(212,178,108,.3)"/><text x="220" y="251" text-anchor="middle" font-family="serif" font-size="21" fill="#EEE7D7">甲申 〜 癸巳</text><circle cx="430" cy="243" r="11" fill="#D9735F"/><text x="510" y="251" text-anchor="middle" font-family="serif" font-size="21" fill="#EEE7D7">火星人</text><text x="760" y="251" text-anchor="middle" font-family="serif" font-size="21" fill="#F7D6DC">午・未</text><rect x="80" y="276" width="800" height="46" rx="8" fill="#15120d" stroke="rgba(212,178,108,.3)"/><text x="220" y="307" text-anchor="middle" font-family="serif" font-size="21" fill="#EEE7D7">甲午 〜 癸卯</text><circle cx="430" cy="299" r="11" fill="#8FB8D8"/><text x="510" y="307" text-anchor="middle" font-family="serif" font-size="21" fill="#EEE7D7">天王星人</text><text x="760" y="307" text-anchor="middle" font-family="serif" font-size="21" fill="#F7D6DC">辰・巳</text><rect x="80" y="332" width="800" height="46" rx="8" fill="#15120d" stroke="rgba(212,178,108,.3)"/><text x="220" y="363" text-anchor="middle" font-family="serif" font-size="21" fill="#EEE7D7">甲辰 〜 癸丑</text><circle cx="430" cy="355" r="11" fill="#7FB08A"/><text x="510" y="363" text-anchor="middle" font-family="serif" font-size="21" fill="#EEE7D7">木星人</text><text x="760" y="363" text-anchor="middle" font-family="serif" font-size="21" fill="#F7D6DC">寅・卯</text><rect x="80" y="388" width="800" height="46" rx="8" fill="#15120d" stroke="rgba(212,178,108,.3)"/><text x="220" y="419" text-anchor="middle" font-family="serif" font-size="21" fill="#EEE7D7">甲寅 〜 癸亥</text><circle cx="430" cy="411" r="11" fill="#6F86C2"/><text x="510" y="419" text-anchor="middle" font-family="serif" font-size="21" fill="#EEE7D7">水星人</text><text x="760" y="419" text-anchor="middle" font-family="serif" font-size="21" fill="#F7D6DC">子・丑</text><text x="480" y="460" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7" opacity=".85">運命星の決め方は、日柱が60干支のどの「旬（10日のまとまり）」に入るかと重なります</text>
</svg>
