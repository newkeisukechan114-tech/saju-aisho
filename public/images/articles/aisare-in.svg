<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="五行ごとに、自分を育ててくれる五行を矢印で表した図。水が木を、木が火を、火が土を、土が金を、金が水を育てる">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="400" fill="url(#bg)"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#D4B26C"/></marker></defs><path d="M516 91 L565 127" stroke="#D4B26C" stroke-width="3" marker-end="url(#ar)"/><path d="M590 197 L571 255" stroke="#D4B26C" stroke-width="3" marker-end="url(#ar)"/><path d="M512 300 L452 300" stroke="#D4B26C" stroke-width="3" marker-end="url(#ar)"/><path d="M390 258 L371 200" stroke="#D4B26C" stroke-width="3" marker-end="url(#ar)"/><path d="M392 129 L441 93" stroke="#D4B26C" stroke-width="3" marker-end="url(#ar)"/><circle cx="480" cy="65" r="38" fill="#15120d" stroke="#5E9C80" stroke-width="3"/><text x="480" y="77" text-anchor="middle" font-family="serif" font-size="34" fill="#5E9C80">木</text><circle cx="604" cy="155" r="38" fill="#15120d" stroke="#C9665B" stroke-width="3"/><text x="604" y="167" text-anchor="middle" font-family="serif" font-size="34" fill="#C9665B">火</text><circle cx="556" cy="300" r="38" fill="#15120d" stroke="#D3A64A" stroke-width="3"/><text x="556" y="312" text-anchor="middle" font-family="serif" font-size="34" fill="#D3A64A">土</text><circle cx="404" cy="300" r="38" fill="#15120d" stroke="#DCD8CC" stroke-width="3"/><text x="404" y="312" text-anchor="middle" font-family="serif" font-size="34" fill="#DCD8CC">金</text><circle cx="356" cy="155" r="38" fill="#15120d" stroke="#6178AE" stroke-width="3"/><text x="356" y="167" text-anchor="middle" font-family="serif" font-size="34" fill="#6178AE">水</text><g font-family="sans-serif" font-size="17" fill="#EEE7D7">
  <text x="60" y="120">矢印のもとが、</text><text x="60" y="148">あなたを育てる五行</text>
  <text x="60" y="190" fill="#D4B26C">例：日主が「木」なら</text><text x="60" y="218">「水」が育ててくれる</text></g>
  <g font-family="sans-serif" font-size="17" fill="#EEE7D7"><text x="700" y="120">育てる五行が少ないと、</text><text x="700" y="148">愛を受けとるのが</text><text x="700" y="176">少し苦手になりやすい</text></g><text x="480.0" y="382" text-anchor="middle" font-family="serif" font-size="21" fill="#D4B26C" letter-spacing="5">あなたを育てる五行（印の星）</text>
</svg>
