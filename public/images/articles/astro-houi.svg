<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="五行と方角の対応を示す図。北は水、東は木、南は火、西は金、中央は土">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="440" fill="url(#bg)"/>
  <text x="480" y="44" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C" letter-spacing="3">五行と方角</text><circle cx="480" cy="220" r="150" fill="none" stroke="#D4B26C" stroke-width="1.5" opacity=".6"/><path d="M480 110 V330 M340 220 H620" stroke="#D4B26C" stroke-width="1" opacity=".4"/><circle cx="480" cy="90" r="34" fill="#15120d" stroke="#6178AE" stroke-width="3"/><text x="480" y="88" text-anchor="middle" font-family="serif" font-size="22" fill="#6178AE">水</text><text x="480" y="110" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#EEE7D7">北</text><circle cx="650" cy="220" r="34" fill="#15120d" stroke="#5E9C80" stroke-width="3"/><text x="650" y="218" text-anchor="middle" font-family="serif" font-size="22" fill="#5E9C80">木</text><text x="650" y="240" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#EEE7D7">東</text><circle cx="480" cy="350" r="34" fill="#15120d" stroke="#C9665B" stroke-width="3"/><text x="480" y="348" text-anchor="middle" font-family="serif" font-size="22" fill="#C9665B">火</text><text x="480" y="370" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#EEE7D7">南</text><circle cx="310" cy="220" r="34" fill="#15120d" stroke="#DCD8CC" stroke-width="3"/><text x="310" y="218" text-anchor="middle" font-family="serif" font-size="22" fill="#DCD8CC">金</text><text x="310" y="240" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#EEE7D7">西</text><circle cx="480" cy="220" r="34" fill="#15120d" stroke="#D3A64A" stroke-width="3"/><text x="480" y="218" text-anchor="middle" font-family="serif" font-size="22" fill="#D3A64A">土</text><text x="480" y="240" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#EEE7D7">中央</text><g font-family="sans-serif" font-size="14" fill="#EEE7D7">
  <text x="700" y="110">東（木）：朝日、森、公園</text><text x="700" y="140">南（火）：明るく暖かい場所</text>
  <text x="700" y="170">西（金）：夕日、美術館</text><text x="700" y="200">北（水）：海、湖、温泉</text>
  <text x="700" y="230">中央（土）：地元、実家</text></g>
  <text x="480" y="428" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#EEE7D7" opacity=".75">※方角の考え方は、流派によって異なります</text>
</svg>
