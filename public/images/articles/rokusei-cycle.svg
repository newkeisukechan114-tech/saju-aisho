<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 545" role="img" aria-label="六星占術の12の周期を円に並べた図。種子・緑生・立花・健弱・達成・乱気・再会・財成・安定・陰影・停止・減退の順で、最後の陰影・停止・減退が大殺界として色分けされている">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="545" fill="url(#bg)"/>
  <text x="480" y="44" text-anchor="middle" font-family="serif" font-size="23" fill="#D4B26C" letter-spacing="3">六星占術の12年の周期と、大殺界</text><circle cx="480" cy="125" r="38" fill="#15120d" stroke="#D4B26C" stroke-opacity="0.5"/><text x="480" y="132" text-anchor="middle" font-family="serif" font-size="20" fill="#EEE7D7">種子</text><circle cx="562" cy="147" r="38" fill="#15120d" stroke="#D4B26C" stroke-opacity="0.5"/><text x="562" y="154" text-anchor="middle" font-family="serif" font-size="20" fill="#EEE7D7">緑生</text><circle cx="623" cy="208" r="38" fill="#15120d" stroke="#D4B26C" stroke-opacity="0.5"/><text x="623" y="214" text-anchor="middle" font-family="serif" font-size="20" fill="#EEE7D7">立花</text><circle cx="645" cy="290" r="38" fill="#4a3a28" stroke="#D4B26C" stroke-opacity="0.5"/><text x="645" y="297" text-anchor="middle" font-family="serif" font-size="20" fill="#EEE7D7">健弱</text><circle cx="623" cy="372" r="38" fill="#15120d" stroke="#D4B26C" stroke-opacity="0.5"/><text x="623" y="380" text-anchor="middle" font-family="serif" font-size="20" fill="#EEE7D7">達成</text><circle cx="562" cy="433" r="38" fill="#4a3a28" stroke="#D4B26C" stroke-opacity="0.5"/><text x="562" y="440" text-anchor="middle" font-family="serif" font-size="20" fill="#EEE7D7">乱気</text><circle cx="480" cy="455" r="38" fill="#15120d" stroke="#D4B26C" stroke-opacity="0.5"/><text x="480" y="462" text-anchor="middle" font-family="serif" font-size="20" fill="#EEE7D7">再会</text><circle cx="398" cy="433" r="38" fill="#15120d" stroke="#D4B26C" stroke-opacity="0.5"/><text x="398" y="440" text-anchor="middle" font-family="serif" font-size="20" fill="#EEE7D7">財成</text><circle cx="337" cy="373" r="38" fill="#15120d" stroke="#D4B26C" stroke-opacity="0.5"/><text x="337" y="380" text-anchor="middle" font-family="serif" font-size="20" fill="#EEE7D7">安定</text><circle cx="315" cy="290" r="38" fill="#7a3b46" stroke="#E59AA8" stroke-opacity="1"/><text x="315" y="297" text-anchor="middle" font-family="serif" font-size="20" fill="#EEE7D7">陰影</text><circle cx="337" cy="208" r="38" fill="#7a3b46" stroke="#E59AA8" stroke-opacity="1"/><text x="337" y="214" text-anchor="middle" font-family="serif" font-size="20" fill="#EEE7D7">停止</text><circle cx="397" cy="147" r="38" fill="#7a3b46" stroke="#E59AA8" stroke-opacity="1"/><text x="397" y="154" text-anchor="middle" font-family="serif" font-size="20" fill="#EEE7D7">減退</text><text x="480" y="282" text-anchor="middle" font-family="serif" font-size="22" fill="#F7D6DC">陰影・停止・減退</text><text x="480" y="312" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#EEE7D7">＝ 大殺界（3年）</text><text x="480" y="525" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7" opacity=".85">健弱は「小殺界」、乱気は「中殺界」と呼ばれます</text>
</svg>
