<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="五行を、火・木・土・金・水の順に横一列に並べた図。火と木の側がドパ寄り、金と水の側がセロ寄りで、土がその真ん中にある">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="400" fill="url(#bg)"/>
  <text x="480" y="48" text-anchor="middle" font-family="serif" font-size="23" fill="#D4B26C" letter-spacing="3">五行で見る「ドパ」と「セロ」</text><defs><linearGradient id="ax" x1="0" x2="1"><stop offset="0" stop-color="#E0784F"/><stop offset=".5" stop-color="#D3A64A"/><stop offset="1" stop-color="#6FA8B8"/></linearGradient></defs><rect x="100" y="200" width="760" height="14" rx="7" fill="url(#ax)"/><circle cx="150" cy="207" r="42" fill="#15120d" stroke="#C9665B" stroke-width="3"/><text x="150" y="220" text-anchor="middle" font-family="serif" font-size="36" fill="#C9665B">火</text><text x="150" y="285" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#EEE7D7">外へ燃えあがる</text><circle cx="310" cy="207" r="42" fill="#15120d" stroke="#5E9C80" stroke-width="3"/><text x="310" y="220" text-anchor="middle" font-family="serif" font-size="36" fill="#5E9C80">木</text><text x="310" y="285" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#EEE7D7">上へのびる</text><circle cx="480" cy="207" r="42" fill="#15120d" stroke="#D3A64A" stroke-width="3"/><text x="480" y="220" text-anchor="middle" font-family="serif" font-size="36" fill="#D3A64A">土</text><text x="480" y="285" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#EEE7D7">受けとめる</text><circle cx="650" cy="207" r="42" fill="#15120d" stroke="#DCD8CC" stroke-width="3"/><text x="650" y="220" text-anchor="middle" font-family="serif" font-size="36" fill="#DCD8CC">金</text><text x="650" y="285" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#EEE7D7">引きしめる</text><circle cx="810" cy="207" r="42" fill="#15120d" stroke="#6178AE" stroke-width="3"/><text x="810" y="220" text-anchor="middle" font-family="serif" font-size="36" fill="#6178AE">水</text><text x="810" y="285" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#EEE7D7">内へしずまる</text><text x="190" y="130" text-anchor="middle" font-family="serif" font-size="26" fill="#E0784F">ドパ寄り</text><text x="190" y="158" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7" opacity=".8">刺激・高揚・広がる</text><text x="770" y="130" text-anchor="middle" font-family="serif" font-size="26" fill="#6FA8B8">セロ寄り</text><text x="770" y="158" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7" opacity=".8">安心・回復・ととのう</text><text x="480" y="360" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#EEE7D7">さらに、陽の干（甲・丙・戊・庚・壬）は外へ、陰の干（乙・丁・己・辛・癸）は内へ向かいやすいと考えます</text>
</svg>
