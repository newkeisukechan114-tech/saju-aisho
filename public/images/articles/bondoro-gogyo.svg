<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-label="五行とシールの対応図。木はグリーンで葉っぱやお花、火は赤やピンクでハートや星、土は黄色やベージュでまるやおかし、金は白やシルバーで宝石、水は青やクリアでしずくや月">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="450" fill="url(#bg)"/>
  <text x="480" y="48" text-anchor="middle" font-family="serif" font-size="23" fill="#D4B26C" letter-spacing="3">五行でえらぶ、シールの色と形</text><rect x="14" y="80" width="164" height="300" rx="16" fill="#15120d" stroke="#5E9C80" stroke-opacity=".6"/><text x="96" y="128" text-anchor="middle" font-family="serif" font-size="34" fill="#5E9C80">木</text><g transform="translate(96 200)"><path d="M-34 20.4 Q-34 -34 34 -34 Q34 20.4 -34 20.4Z" fill="#5E9C80"/><ellipse cx="-10.2" cy="-11.899999999999999" rx="9.520000000000001" ry="5.44" fill="#fff" opacity=".7" transform="rotate(-30 -10.2 -11.899999999999999)"/><circle cx="11.899999999999999" cy="10.2" r="2.3800000000000003" fill="#fff" opacity=".6"/></g><text x="96" y="290" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7">グリーン・若草色</text><text x="96" y="335" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#D4B26C">葉っぱ・お花</text><rect x="206" y="80" width="164" height="300" rx="16" fill="#15120d" stroke="#C9665B" stroke-opacity=".6"/><text x="288" y="128" text-anchor="middle" font-family="serif" font-size="34" fill="#C9665B">火</text><g transform="translate(288 200)"><path d="M0 30.6 C-40.8 3.4000000000000004 -34 -30.6 0 -11.899999999999999 C34 -30.6 40.8 3.4000000000000004 0 30.6Z" fill="#C9665B"/><ellipse cx="-10.2" cy="-11.899999999999999" rx="9.520000000000001" ry="5.44" fill="#fff" opacity=".7" transform="rotate(-30 -10.2 -11.899999999999999)"/><circle cx="11.899999999999999" cy="10.2" r="2.3800000000000003" fill="#fff" opacity=".6"/></g><text x="288" y="290" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7">赤・ピンク</text><text x="288" y="335" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#D4B26C">ハート・星</text><rect x="398" y="80" width="164" height="300" rx="16" fill="#15120d" stroke="#D3A64A" stroke-opacity=".6"/><text x="480" y="128" text-anchor="middle" font-family="serif" font-size="34" fill="#D3A64A">土</text><g transform="translate(480 200)"><circle r="34" fill="#D3A64A"/><ellipse cx="-10.2" cy="-11.899999999999999" rx="9.520000000000001" ry="5.44" fill="#fff" opacity=".7" transform="rotate(-30 -10.2 -11.899999999999999)"/><circle cx="11.899999999999999" cy="10.2" r="2.3800000000000003" fill="#fff" opacity=".6"/></g><text x="480" y="290" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7">黄色・ベージュ</text><text x="480" y="335" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#D4B26C">まる・おかし</text><rect x="590" y="80" width="164" height="300" rx="16" fill="#15120d" stroke="#DCD8CC" stroke-opacity=".6"/><text x="672" y="128" text-anchor="middle" font-family="serif" font-size="34" fill="#DCD8CC">金</text><g transform="translate(672 200)"><path d="M-34 -10.2 L-17.0 -30.6 L17.0 -30.6 L34 -10.2 L0 34Z" fill="#DCD8CC"/><ellipse cx="-10.2" cy="-11.899999999999999" rx="9.520000000000001" ry="5.44" fill="#fff" opacity=".7" transform="rotate(-30 -10.2 -11.899999999999999)"/><circle cx="11.899999999999999" cy="10.2" r="2.3800000000000003" fill="#fff" opacity=".6"/></g><text x="672" y="290" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7">白・シルバー・オーロラ</text><text x="672" y="335" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#D4B26C">宝石・キラキラ</text><rect x="782" y="80" width="164" height="300" rx="16" fill="#15120d" stroke="#6178AE" stroke-opacity=".6"/><text x="864" y="128" text-anchor="middle" font-family="serif" font-size="34" fill="#6178AE">水</text><g transform="translate(864 200)"><path d="M0 -40.8 C30.6 -3.4000000000000004 34 10.2 34 13.600000000000001 A34 34 0 0 1 -34 13.600000000000001 C-34 10.2 -30.6 -3.4000000000000004 0 -40.8Z" fill="#6178AE"/><ellipse cx="-10.2" cy="-11.899999999999999" rx="9.520000000000001" ry="5.44" fill="#fff" opacity=".7" transform="rotate(-30 -10.2 -11.899999999999999)"/><circle cx="11.899999999999999" cy="10.2" r="2.3800000000000003" fill="#fff" opacity=".6"/></g><text x="864" y="290" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7">青・黒・クリア</text><text x="864" y="335" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#D4B26C">しずく・月</text><text x="480" y="420" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#EEE7D7" opacity=".9">自分の日主と同じ五行、または自分を育てる五行の色を選ぶと、気分が上がりやすいとされます</text>
</svg>
