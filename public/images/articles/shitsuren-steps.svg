<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-label="失恋から立ち直るまでの3つの段階の図。受け止める、整える、次へ動く">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="380" fill="url(#bg)"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#D4B26C"/></marker></defs><text x="480" y="46" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C" letter-spacing="3">失恋から立ち直るまでの、3つの段階</text><rect x="70" y="90" width="240" height="230" rx="12" fill="#15120d" stroke="#9aa6c4" stroke-width="2"/><circle cx="190" cy="140" r="28" fill="none" stroke="#9aa6c4" stroke-width="2.5"/><text x="190" y="150" text-anchor="middle" font-family="serif" font-size="28" fill="#9aa6c4">1</text><text x="190" y="210" text-anchor="middle" font-family="serif" font-size="24" fill="#9aa6c4">受け止める</text><text x="190" y="254" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#EEE7D7">悲しい気持ちを</text><text x="190" y="282" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#EEE7D7">否定しない</text><path d="M318 205 H362" stroke="#D4B26C" stroke-width="3" marker-end="url(#ar)"/><rect x="370" y="90" width="240" height="230" rx="12" fill="#15120d" stroke="#D4B26C" stroke-width="2"/><circle cx="490" cy="140" r="28" fill="none" stroke="#D4B26C" stroke-width="2.5"/><text x="490" y="150" text-anchor="middle" font-family="serif" font-size="28" fill="#D4B26C">2</text><text x="490" y="210" text-anchor="middle" font-family="serif" font-size="24" fill="#D4B26C">整える</text><text x="490" y="254" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#EEE7D7">眠る・食べる・</text><text x="490" y="282" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#EEE7D7">話す、を取り戻す</text><path d="M618 205 H662" stroke="#D4B26C" stroke-width="3" marker-end="url(#ar)"/><rect x="670" y="90" width="240" height="230" rx="12" fill="#15120d" stroke="#5E9C80" stroke-width="2"/><circle cx="790" cy="140" r="28" fill="none" stroke="#5E9C80" stroke-width="2.5"/><text x="790" y="150" text-anchor="middle" font-family="serif" font-size="28" fill="#5E9C80">3</text><text x="790" y="210" text-anchor="middle" font-family="serif" font-size="24" fill="#5E9C80">次へ動く</text><text x="790" y="254" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#EEE7D7">自分の時間を</text><text x="790" y="282" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#EEE7D7">少しずつ増やす</text><text x="480" y="356" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7" opacity=".8">行ったり来たりしても大丈夫。順番どおりに進まなくても、少しずつ前に進んでいます</text>
</svg>
