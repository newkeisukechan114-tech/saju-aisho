<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-label="ソウルの地図をイメージした図。漢江の北に弘大と鍾路・仁寺洞、南に江南があり、それぞれ占いの店が集まるエリアとして印がついている">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="460" fill="url(#bg)"/>
  <text x="480" y="46" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C" letter-spacing="3">ソウルで占いが集まるエリア（イメージ）</text><path d="M80 300 C260 260 380 330 520 300 S800 250 900 290" stroke="#2F4E8C" stroke-width="26" fill="none" opacity=".6"/><text x="860" y="330" font-family="sans-serif" font-size="14" fill="#EEE7D7" opacity=".7">漢江</text><circle cx="250" cy="160" r="12" fill="#b0453a"/><circle cx="250" cy="160" r="26" fill="none" stroke="#b0453a" opacity=".5"/><text x="250" y="122" text-anchor="middle" font-family="serif" font-size="20" fill="#EEE7D7">弘大（ホンデ）</text><text x="250" y="212" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#D4B26C">タロット通り・若者向け</text><circle cx="560" cy="140" r="12" fill="#b0453a"/><circle cx="560" cy="140" r="26" fill="none" stroke="#b0453a" opacity=".5"/><text x="560" y="102" text-anchor="middle" font-family="serif" font-size="20" fill="#EEE7D7">鍾路・仁寺洞</text><text x="560" y="192" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#D4B26C">伝統的な店・サジュカフェ</text><circle cx="700" cy="370" r="12" fill="#b0453a"/><circle cx="700" cy="370" r="26" fill="none" stroke="#b0453a" opacity=".5"/><text x="700" y="332" text-anchor="middle" font-family="serif" font-size="20" fill="#EEE7D7">江南（カンナム）</text><text x="700" y="422" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#D4B26C">予約制の店・おしゃれなカフェ</text><g transform="translate(120 360)"><rect width="90" height="66" rx="8" fill="#F3EAD6"/><text x="45" y="30" text-anchor="middle" font-family="serif" font-size="18" fill="#2B2118">四柱</text><text x="45" y="52" text-anchor="middle" font-family="serif" font-size="13" fill="#7A5E2E">사주</text></g><text x="480.0" y="450" text-anchor="middle" font-family="serif" font-size="21" fill="#D4B26C" letter-spacing="5">位置はイメージです</text>
</svg>
