<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-label="立冬の夜のイメージイラスト。月と山茶花、静かな水面">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1020"/><stop offset=".65" stop-color="#1b2340"/><stop offset="1" stop-color="#24304f"/></linearGradient>
    <radialGradient id="moon" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f3ead2" stop-opacity=".55"/><stop offset="1" stop-color="#f3ead2" stop-opacity="0"/></radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e2a48"/><stop offset="1" stop-color="#0e1428"/></linearGradient>
  </defs>
  <rect width="960" height="480" fill="url(#sky)"/>
  <circle cx="700" cy="120" r="120" fill="url(#moon)"/>
  <circle cx="700" cy="120" r="44" fill="#f3ead2"/>
  <g fill="#dfe6f5"><circle cx="120" cy="80" r="2"/><circle cx="240" cy="140" r="1.6"/><circle cx="380" cy="60" r="1.4"/><circle cx="520" cy="110" r="1.8"/><circle cx="860" cy="60" r="1.6"/><circle cx="900" cy="200" r="1.4"/><circle cx="60" cy="200" r="1.6"/></g>
  <!-- falling snow -->
  <g fill="#ffffff" opacity=".7"><circle cx="180" cy="230" r="2.4"/><circle cx="300" cy="190" r="2"/><circle cx="430" cy="250" r="2.6"/><circle cx="560" cy="210" r="2"/><circle cx="820" cy="260" r="2.4"/><circle cx="640" cy="280" r="1.8"/></g>
  <!-- water -->
  <rect y="330" width="960" height="150" fill="url(#water)"/>
  <ellipse cx="700" cy="362" rx="34" ry="6" fill="#f3ead2" opacity=".55"/>
  <ellipse cx="700" cy="384" rx="22" ry="4" fill="#f3ead2" opacity=".35"/>
  <ellipse cx="700" cy="402" rx="14" ry="3" fill="#f3ead2" opacity=".2"/>
  <g stroke="#7f93c4" stroke-opacity=".4" stroke-width="2"><path d="M80 370 H260 M380 400 H560 M120 430 H300 M600 440 H880"/></g>
  <!-- sasanqua branch -->
  <g>
    <path d="M0 300 C120 290 200 260 300 240" stroke="#3b2a2a" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M140 284 C160 262 180 252 205 248" stroke="#3b2a2a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <g fill="#2f5a46"><ellipse cx="90" cy="282" rx="22" ry="10" transform="rotate(-20 90 282)"/><ellipse cx="250" cy="236" rx="22" ry="10" transform="rotate(-35 250 236)"/><ellipse cx="190" cy="270" rx="18" ry="8" transform="rotate(25 190 270)"/></g>
    <g transform="translate(300 238)"><g fill="#e98aa0"><circle cx="0" cy="-16" r="13"/><circle cx="15" cy="-5" r="13"/><circle cx="9" cy="13" r="13"/><circle cx="-9" cy="13" r="13"/><circle cx="-15" cy="-5" r="13"/></g><circle r="7" fill="#f6d27a"/></g>
    <g transform="translate(210 246) scale(.75)"><g fill="#f2a9b8"><circle cx="0" cy="-16" r="13"/><circle cx="15" cy="-5" r="13"/><circle cx="9" cy="13" r="13"/><circle cx="-9" cy="13" r="13"/><circle cx="-15" cy="-5" r="13"/></g><circle r="7" fill="#f6d27a"/></g>
  </g>
  <text x="480" y="460" text-anchor="middle" font-family="serif" font-size="22" fill="#dfe6f5" letter-spacing="6">立冬 ― 水の月のはじまり</text>
</svg>
