<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="横軸にサジュの10年ごとの運の流れ、縦軸にアストロマップの惑星の線を置き、その重なるところに光が灯る図">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="400" fill="url(#bg)"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#D4B26C"/></marker></defs><text x="480" y="48" text-anchor="middle" font-family="serif" font-size="22" fill="#D4B26C" letter-spacing="3">サジュは「いつ」、アストロマップは「どこで」</text>
  <path d="M140 340 H860" stroke="#EEE7D7" stroke-width="2" marker-end="url(#ar)"/><path d="M140 340 V90" stroke="#EEE7D7" stroke-width="2" marker-end="url(#ar)"/>
  <text x="860" y="372" text-anchor="end" font-family="sans-serif" font-size="15" fill="#D4B26C">いつ（サジュの運の流れ）</text>
  <text x="128" y="100" text-anchor="end" font-family="sans-serif" font-size="15" fill="#D4B26C">どこで</text>
  <text x="128" y="120" text-anchor="end" font-family="sans-serif" font-size="12" fill="#EEE7D7" opacity=".8">（アストロマップ）</text><rect x="160" y="300" width="160" height="30" rx="4" fill="#5E9C80" opacity=".35"/><text x="240" y="321" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7">大運 1（10年）</text><rect x="330" y="300" width="160" height="30" rx="4" fill="#C9665B" opacity=".35"/><text x="410" y="321" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7">大運 2（10年）</text><rect x="500" y="300" width="160" height="30" rx="4" fill="#D3A64A" opacity=".35"/><text x="580" y="321" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7">大運 3（10年）</text><rect x="670" y="300" width="160" height="30" rx="4" fill="#DCD8CC" opacity=".35"/><text x="750" y="321" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#EEE7D7">大運 4（10年）</text><path d="M150 130 H840" stroke="#e98aa0" stroke-width="2" stroke-dasharray="6 6" opacity=".8"/><text x="160" y="122" font-family="sans-serif" font-size="13" fill="#e98aa0">金星の線：恋愛</text><path d="M150 185 H840" stroke="#D4B26C" stroke-width="2" stroke-dasharray="6 6" opacity=".8"/><text x="160" y="177" font-family="sans-serif" font-size="13" fill="#D4B26C">木星の線：発展</text><path d="M150 240 H840" stroke="#a9b4c8" stroke-width="2" stroke-dasharray="6 6" opacity=".8"/><text x="160" y="232" font-family="sans-serif" font-size="13" fill="#a9b4c8">月の線：安心</text><circle cx="590" cy="185" r="16" fill="#D4B26C"/><circle cx="590" cy="185" r="32" fill="#D4B26C" opacity=".2"/><text x="630" y="220" font-family="sans-serif" font-size="14" fill="#EEE7D7">運の流れがいい時期に、合う場所へ</text>
</svg>
