<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-label="日主の五行ごとの、あふれた気持ちの流し先の一覧。木は火へ、火は土へ、土は金へ、金は水へ、水は木へ">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1622"/><stop offset="1" stop-color="#0c0b10"/></linearGradient><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4B26C" stop-opacity=".3"/><stop offset="1" stop-color="#D4B26C" stop-opacity="0"/></radialGradient></defs>
  <rect width="960" height="560" fill="url(#bg)"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#D4B26C"/></marker></defs><text x="480" y="50" text-anchor="middle" font-family="serif" font-size="24" fill="#D4B26C" letter-spacing="4">あふれた気持ちの「流し先」</text><rect x="60" y="80" width="840" height="78" rx="10" fill="#15120d" stroke="rgba(212,178,108,.35)"/>
  <text x="90" y="110" font-family="sans-serif" font-size="14" fill="#D4B26C">あなたの日主</text>
  <circle cx="230" cy="119" r="27" fill="none" stroke="#5E9C80" stroke-width="3"/><text x="230" y="130" text-anchor="middle" font-family="serif" font-size="28" fill="#5E9C80">木</text>
  <path d="M272 119 L352 119" stroke="#D4B26C" stroke-width="2" marker-end="url(#ar)"/>
  <circle cx="395" cy="119" r="27" fill="#C9665B" opacity=".25"/><circle cx="395" cy="119" r="27" fill="none" stroke="#C9665B" stroke-width="3"/><text x="395" y="130" text-anchor="middle" font-family="serif" font-size="28" fill="#C9665B">火</text>
  <text x="450" y="112" font-family="sans-serif" font-size="14" fill="#D4B26C">流し先は</text>
  <text x="450" y="138" font-family="sans-serif" font-size="20" fill="#EEE7D7">表現する・楽しむ</text><rect x="60" y="172" width="840" height="78" rx="10" fill="#15120d" stroke="rgba(212,178,108,.35)"/>
  <text x="90" y="202" font-family="sans-serif" font-size="14" fill="#D4B26C">あなたの日主</text>
  <circle cx="230" cy="211" r="27" fill="none" stroke="#C9665B" stroke-width="3"/><text x="230" y="222" text-anchor="middle" font-family="serif" font-size="28" fill="#C9665B">火</text>
  <path d="M272 211 L352 211" stroke="#D4B26C" stroke-width="2" marker-end="url(#ar)"/>
  <circle cx="395" cy="211" r="27" fill="#D3A64A" opacity=".25"/><circle cx="395" cy="211" r="27" fill="none" stroke="#D3A64A" stroke-width="3"/><text x="395" y="222" text-anchor="middle" font-family="serif" font-size="28" fill="#D3A64A">土</text>
  <text x="450" y="204" font-family="sans-serif" font-size="14" fill="#D4B26C">流し先は</text>
  <text x="450" y="230" font-family="sans-serif" font-size="20" fill="#EEE7D7">いつもの日常に戻る</text><rect x="60" y="264" width="840" height="78" rx="10" fill="#15120d" stroke="rgba(212,178,108,.35)"/>
  <text x="90" y="294" font-family="sans-serif" font-size="14" fill="#D4B26C">あなたの日主</text>
  <circle cx="230" cy="303" r="27" fill="none" stroke="#D3A64A" stroke-width="3"/><text x="230" y="314" text-anchor="middle" font-family="serif" font-size="28" fill="#D3A64A">土</text>
  <path d="M272 303 L352 303" stroke="#D4B26C" stroke-width="2" marker-end="url(#ar)"/>
  <circle cx="395" cy="303" r="27" fill="#DCD8CC" opacity=".25"/><circle cx="395" cy="303" r="27" fill="none" stroke="#DCD8CC" stroke-width="3"/><text x="395" y="314" text-anchor="middle" font-family="serif" font-size="28" fill="#DCD8CC">金</text>
  <text x="450" y="296" font-family="sans-serif" font-size="14" fill="#D4B26C">流し先は</text>
  <text x="450" y="322" font-family="sans-serif" font-size="20" fill="#EEE7D7">整理して、線を引く</text><rect x="60" y="356" width="840" height="78" rx="10" fill="#15120d" stroke="rgba(212,178,108,.35)"/>
  <text x="90" y="386" font-family="sans-serif" font-size="14" fill="#D4B26C">あなたの日主</text>
  <circle cx="230" cy="395" r="27" fill="none" stroke="#DCD8CC" stroke-width="3"/><text x="230" y="406" text-anchor="middle" font-family="serif" font-size="28" fill="#DCD8CC">金</text>
  <path d="M272 395 L352 395" stroke="#D4B26C" stroke-width="2" marker-end="url(#ar)"/>
  <circle cx="395" cy="395" r="27" fill="#6178AE" opacity=".25"/><circle cx="395" cy="395" r="27" fill="none" stroke="#6178AE" stroke-width="3"/><text x="395" y="406" text-anchor="middle" font-family="serif" font-size="28" fill="#6178AE">水</text>
  <text x="450" y="388" font-family="sans-serif" font-size="14" fill="#D4B26C">流し先は</text>
  <text x="450" y="414" font-family="sans-serif" font-size="20" fill="#EEE7D7">静かに休む</text><rect x="60" y="448" width="840" height="78" rx="10" fill="#15120d" stroke="rgba(212,178,108,.35)"/>
  <text x="90" y="478" font-family="sans-serif" font-size="14" fill="#D4B26C">あなたの日主</text>
  <circle cx="230" cy="487" r="27" fill="none" stroke="#6178AE" stroke-width="3"/><text x="230" y="498" text-anchor="middle" font-family="serif" font-size="28" fill="#6178AE">水</text>
  <path d="M272 487 L352 487" stroke="#D4B26C" stroke-width="2" marker-end="url(#ar)"/>
  <circle cx="395" cy="487" r="27" fill="#5E9C80" opacity=".25"/><circle cx="395" cy="487" r="27" fill="none" stroke="#5E9C80" stroke-width="3"/><text x="395" y="498" text-anchor="middle" font-family="serif" font-size="28" fill="#5E9C80">木</text>
  <text x="450" y="480" font-family="sans-serif" font-size="14" fill="#D4B26C">流し先は</text>
  <text x="450" y="506" font-family="sans-serif" font-size="20" fill="#EEE7D7">体を動かす・挑戦する</text>
</svg>
